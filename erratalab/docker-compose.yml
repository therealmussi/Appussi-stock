services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erratalab
      POSTGRES_PASSWORD: erratalab
      POSTGRES_DB: erratalab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erratalab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DATABASE_URL: postgresql+psycopg2://erratalab:erratalab@db:5432/erratalab
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
