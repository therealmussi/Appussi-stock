    if(has("knows_quiet_place")||has("alex_witness")||fraud) return "too_late";
    return "unknown";
  }
  if(has("publish")) return "alternative";
  if(S.flags.final_press && fraud) return "truth";
  if(fraud && debt) return "truth";
  if(has("helped_mara_night")||has("helped_sofia")||has("final_alex_flees")) return "sacrifice";
  return "too_late";
};

STORY.ENDINGS = {

  truth: {
    num:"ENDING 01", title:"THE TRUTH", tone:"rare",
    text:function(){
      let p1="At 23:41 a tram sighs past the lower quay. Alex talks and you listen, and the folder passes from his city to yours. There is no ceremony. Two friends on a cold bench, dividing the last bread of a very long day.";
      let p2="At 06:14, the Vespera Herald runs the story under a headline Nadia has been sharpening for two years: 'THE SCHEDULE OF A THEFT — two years of altered manifests at Kessler Logistics, and the men who signed them.' Customs opens the file it had politely ignored. Brandt is detained before his second coffee. Sera is harder — Sera is always harder — but with the payments mapped by a witness who has stopped being afraid, his quiet stops being for sale.";
      let p3="Jonas testifies. It costs him the job, the ironed shirts, and the last denial he owned. It buys him back his brother. On the 23rd of November the café keeps a corner table and someone sings the right year, finally, and nobody hides anything anywhere, including behind a bench on the Vodna quay.";
      if(has("helped_mara_night")) p3="Jonas testifies. It costs him the job and the last denial he owned. It buys him back his brother. Mara keeps the café; its corner table now comes with a story she tells only people she likes. On the 23rd of November someone sings the right year, finally, and nobody hides anything anywhere.";
      return p1+"\n\n"+p2+"\n\n"+p3+"\n\nYou did not do everything today. Nobody can. You did enough of the right things, at the cost of everything else, which is the entire price of the truth.";
    },
    fates:function(){
      return "— Alex: safe; witness for the customs case; still slow-walks past the yard, now with a lawyer.\n— Jonas: unemployed, cooperating, lighter. 'I'll fix it' is finally true.\n— Mara & Sofia: keep saying what they saw until it has legal weight.\n— Nadia: byline of the year. Sleeps with the window open anyway.\n— Brandt: detained. His handshake is in evidence.\n— Sera: sells the shop in one afternoon. The fox keeps the glasses.\n— Devin: trades testimony for a Friday he actually takes off.";
    }
  },

  too_late: {
    num:"ENDING 02", title:"TOO LATE", tone:"bad",
    text:function(){
      if(S.flags.met_alex){
        return "You found him. You sat on the bench, you heard the shape of it — and somehow the shape never became a fact. Too many of the day's doors were guessed at, closed politely, left unopened in their turns.\n\nAlex hands you the folder because there is nobody else. \"We're not done,\" he says. But he says it like a man practicing.\n\nThe truth is now a folder in your hands, without names attached, without the men who signed it, without the story that would make anyone care. By morning it is a problem you own, delayed past the hour when problems are cheap.";
      }
      if(has("brandt_told") && !has("knows_station_meet")){
        return "You learned everything. The yard. The envelope. The manifests. You told Alex at 23:0X that Brandt knows — and Alex told you, very calmly, that the bench stopped being safe an hour before you knew it was.\n\nHe does not blame you out loud. He just re-plans his entire life in front of you, and at 23:52 he does the thing you were supposed to prevent: he becomes untraceable for a week.\n\nThe information was never the hard part. The hard part was today's schedule, and the number of hours in it, and you found that out at the exact hour it stopped being fixable.";
      }
      return "You knew. That's the cruel version — you knew. The bench, the hour, the boy: all of it was on your schedule from morning, and the day was simply full of everything else, and everything else won.\n\nAt 23:41 Alex waits with the river. At 23:58 he stops waiting. At 06:20 he takes the early train out of Vespera with one bag and no forwarding address, and the city absorbs his absence the way it absorbs everything: completely, by lunch.\n\nThe swans get fed by strangers now.";
    },
    fates:function(){
      return S.flags.met_alex
        ? "— Alex: alive, exposed, unhired. The folder ferments in your drawer.\n— Jonas: still owes. Still ironed. Still silent.\n— Mara: keeps your coffee order alive, like a small protest.\n— Brandt: promoted. The section number gains a number.\n— Sera: expands. Quiet is a growth market.\n— Nadia: keeps the half-file. Half is her favorite size for unsolved."
        : "— Alex: untraceable — for a week, he hoped. It ran long.\n— Jonas: finds out from a lawyer what his brother tried to carry alone.\n— Mara: closes the café on time, every night, watching the door.\n— Sofia: keeps 'the quiet place' between her teeth, out of loyalty.\n— Brandt & Sera: untouched. The city called it 'procedural'.";
    }
  },

  wrong_person: {
    num:"ENDING 03", title:"THE WRONG PERSON", tone:"bad",
    text:function(){
      if(S.flags.doc_sold){
        return "At the bench, Alex talks, and somewhere past the second sentence he understands what your emptied hands mean. He doesn't raise his voice. He asks who, exactly, and in what drawer.\n\n\"You sold it,\" he says. 'To the shop. My proof. In a drawer.'\n\nThe folder is already filed, under 'acquisitions of the afternoon'. The word for what you did with your day is 'commerce'. The word for what Alex does now is 'leaves.' Some lessons arrive with their own goodbye.";
      }
      if(S.flags.final_bill_brandt){
        return "At the bench, you make the quiet deal out loud: folder to Brandt, debt to zero, Jonas to sleep. Alex is quiet so long the river fills the gap.\n\n\"He'll sign the debt away,\" Alex agrees, eventually. 'That's the thing about men like Brandt — they honor exactly as much as they fear.'\n\nBy Thursday, Brandt honors a document that never existed, Sera's collector is told the account is 'municipal' now, and the manifests are ash in a yard that produces its own weather of smoke. Your brother-in-law-safe. Your friend: gone by the weekend train. You chose the person you could reach over the person you could have saved.";
      }
      return "At the bench there is no Alex. There is Devin, on time, holding Alex's lighter like a receipt for the evening.\n\nThe bench was watched. Of course it was watched — you personally delivered the news that made it worth watching. Somewhere behind the tram lines, a boy who spent all day planning travel schedules for other people's freight is now planning his own, permanently, from a city with a different name.\n\nYou told one man one thing on one afternoon. It's astonishing, later, how far one sentence can travel when its payer is willing to buy the ticket.";
    },
    fates:function(){
      return "— Alex: moved. Twice. Then a third time, quieter.\n— Jonas: debt 'restructured' — Sera's word for a longer leash.\n— Mara: stays. Somebody has to say Alex's name out loud in this town.\n— Brandt: unexamined, unhurried, excellent.\n— Sera: satisfied customer. You.\n— Nadia: keeps the half-file. Two years is a long time to stay unfinishable.";
    }
  },

  alternative: {
    num:"ENDING 04", title:"THE ALTERNATIVE", tone:"good",
    text:function(){
      return "You went to the Herald before you went to the bench, and that single re-ordering of hours changed the ending of the day.\n\nAt 00:01 the presses run cold. At 06:14 the story is everywhere: manifests, timestamps, photographs, names. Vespera wakes up to its own reflection and does not blink first.\n\nAt 06:20, Alex takes no train at all — he takes the protection of writers, lawyers, and one customs officer who waited a decade for cover, and he becomes something the grey coat did not plan for: unnecessary to protect. Timetables protect better than friends; they cannot be ambushed on a bench.\n\nBrandt is detained by breakfast. Sera's shop develops a sudden termite problem — of police. And the two of you feed the swans at noon, in full daylight, like the teenagers who wrote on that bench with a borrowed fork.";
    },
    fates:function(){
      return "— Alex: safe, subpoenaed, insufferable about it. Correctly.\n— Jonas: testifies in a suit he already owned. Compounding, at last, in his favor.\n— Nadia: the story, the byline, the promotion she refuses.\n— Mara: names a coffee after you. It is mostly foam.\n— Sofia: night shifts, same as ever, less alone.\n— Brandt: 'assisting authorities with their inquiries', indefinitely.\n— Sera: sells the shop in one afternoon. The fox keeps the glasses.";
    }
  },

  sacrifice: {
    num:"ENDING 05", title:"THE SACRIFICE", tone:"bitter",
    text:function(){
      return "The evening went to someone else's catastrophe — and you were there for all of it, hands used, name remembered by people you will now be lucky enough to know for decades.\n\nSo at 23:0X you sit on the swans' bench with nothing but yourself, and it turns out that was the payment Alex actually required.\n\nHe doesn't bring out the folder at first. He checks the quay behind you twice and asks: 'Are they safe? All of them?'. You say yes, and your voice holds, and that testimony has no signatures but stands.\n\nThe manifests come out eventually. When they do, it's clear neither of you has a plan anymore — only the morning, and Nadia's doorbell, and the first stop being Jonas's floor. It is not the clean version of the truth. It is the version you could afford, and you paid for it with the part of the day where nobody was watching.";
    },
    fates:function(){
      return "— Alex: safe, unproven, and stubborn. The folder survived its day.\n— Jonas: hears everything at breakfast. His shoulders drop an inch he never gets back.\n— Mara: covered for you twice now. Keeps a list, keeps a grin.\n— Sofia: owes you a shift and repays it in coffee, not money. Same as ever.\n— Brandt & Sera: unhurried — but now two people with a bench and a plan disagree with that.";
    }
  },

  unknown: {
    num:"ENDING 06", title:"THE UNKNOWN", tone:"bad",
    text:function(){
      return "Midnight arrives the way it does in cities that don't require your participation: everywhere at once, for everyone.\n\nYou spent the day where the day took you — coffee, corridors, conversations that were only ever rehearsal for conversations. The note in the hall stayed a riddle. The swans went unfed by anyone specific. Somewhere across the city, a friend with a plan C and no plan for the plan failing sat on a cold bench by himself, and after a while, stood up.\n\nAt 06:20 he leaves. You find out eventually, the way you find out everything in this city: late, secondhand, too well-packed to unfold.\n\nThe worst endings aren't dramatic. They're administrative.";
    },
    fates:function(){
      return "— Alex: moved on. The word his brother uses later is 'protected', and it takes Jonas years to forgive the word.\n— Jonas: never learns what his brother tried to carry, which is its own sentence.\n— Mara: keeps your chair free at the corner table. Habit outlives hope.\n— Sofia: still has 'the quiet place' between her teeth, out of loyalty, out of grief.\n— Brandt & Sera: procedural. Onwards. Unexamined, unexpressed, unhurried.";
    }
  }
};

</script>
<script>
/* ============================================================
   24 HOURS — engine: state, discrete time, events, calls, saves
   ============================================================ */
"use strict";

var S = null;

const Engine = {

  DEFAULTS: function(){
    return {
      version: 1, plus:false,
      time: h(8,0), loc:"apartment",
      flags:{}, clues:{}, rel:{ mara:2, sofia:2, jonas:1, elio:1, nadia:1, viktor:0, brandt:0, devin:0 },
      msgs:{}, callLog:[], feed:[], missed:[],
      fired:{}, codeTries:0, metAlex:false, ending:null
    };
  },

  /* ---------------- lifecycle ---------------- */
  newGame(plus){
    S = this.DEFAULTS();
    S.plus = !!plus;
    if(plus){
      const arch = UI.loadArchive();
      if(arch && arch.length){
        const last = arch[arch.length-1];
        S.memories = (last.feed||[]).filter(function(f){ return f.kind!=="note"; }).slice(-14);
      }
    }
    setF("begin_day");
    giveClue("begin_day");
    feedAdd("sys","08:00 — Vespera, Venskaya Hill. The day starts with a phone already ringing.");
    UI.showGame();
    UI.initMap();
    UI.render();
    Engine.intro();
  },

  hasSave(){ try{ return !!localStorage.getItem("24h_save"); }catch(e){ return false; } },

  save(){ try{ localStorage.setItem("24h_save", JSON.stringify(S)); }catch(e){} },
  load(){ try{ const r = localStorage.getItem("24h_save"); if(!r) return false; S = JSON.parse(r); UI.showGame(); UI.initMap(); UI.render(); return true; }catch(e){ return false; } },
  wipe(){ try{ localStorage.removeItem("24h_save"); }catch(e){} S=null; },

  /* ---------------- intro cinematic ---------------- */
  intro(){
    const LINES = [
      ["sys","08:00 — Thursday, 12 October. Vespera."],
      ["","The phone rings exactly once before morning has finished inventing itself."],
      ["speaker","ALEX"],
      ["","\"Hey. Listen — don't talk, I only have a second. We need to talk. Something happened last night.\""],
      ["","\"I can't explain it over the phone. Meet me before midnight. The quiet place. You know which one.\""],
      ["","\"And— don't call me. Don't come to the yard. If I don't call you by noon, it's because I can't.\""],
      ["sys","The line dies. You are 22 years old, it is 08:00, and you have sixteen hours."],
      ["sys","Everything you do today will cost minutes. The city will not wait. Begin."],
      ["ACTION","16 HOURS UNTIL MIDNIGHT"]
    ];
    UI.introOverlay(LINES);
  },

  /* ---------------- time & events ---------------- */
  canAfford(cost){ return S.time + cost <= 1440; },

  advance(cost){
    S.time = Math.min(1440, S.time + cost);
    this.fireEvents();
    if(S.time >= 1440){ this.reachMidnight(); return false; }
    return true;
  },

  fireEvents(){
    const evs = STORY.EVENTS.slice().sort(function(a,b){ return a.t-b.t; });
    for(let i=0;i<evs.length;i++){
      const e = evs[i];
      if(S.fired[e.id]) continue;
      if(e.t > S.time) continue;
      if(e.cond && !e.cond(S)) continue;
      const active = !e.winEnd || S.time <= e.winEnd;
      S.fired[e.id] = true;
      const res = e.run(active);
      if(res) Engine.resolve(res);
      if(S.ending) return;
    }
  },

  /* resolve whatever a story function returned */
  resolve(res){
    if(!res) return;
    if(typeof res === "string"){
      UI.showScene({ title:"", text:res });
      return;
    }
    if(res.node){ UI.showScene(res.node); return; }
    UI.showScene(res);
  },

  /* ---------------- actions ---------------- */
  runAction(act, locId){
    if(!this.canAfford(act.cost)){ UI.toast("Not enough time left — that would run past midnight.", true); return; }
    if(act.cond && !act.cond()) return;
    if(act.once && has(act.once)) return;
    if(act.lockersOnly){
      const L = DATA.LOCATIONS[locId].lockers;
      if(L && (S.time < L[0] || S.time >= L[1])){ UI.toast("The locker hall is closed (06:00–22:00). Elio reads gossip, not exceptions.", true); return; }
    }
    if(act.hours){
      if(S.time < act.hours[0] || S.time > act.hours[1]){ UI.toast("The mail has already been collected for today.", true); return; }
    }
    if(act.cost>0){ if(!Engine.advance(act.cost)) return; }
    if(S.ending) return;
    this.save();
    let res;
    try { res = act.run(); } catch(err){ console.error(err); UI.toast("Something went wrong with that action.", true); return; }
    if(res!=null) this.resolve(res);
    UI.render();
  },

  /* ---------------- travel ---------------- */
  travelTime(from,to){ return DATA.MATRIX[from][to]!=null ? DATA.MATRIX[from][to] : DATA.MATRIX[to][from]; },

  travel(to){
    const cost = this.travelTime(S.loc,to);
    if(!this.canAfford(cost)){ UI.toast("You'd still be walking at midnight. Too late for that distance.", true); return; }
    const fromName = DATA.LOCATIONS[S.loc].name;
    S.loc = to;
    if(!Engine.advance(cost)) return;
    feedAdd("sys", fmt(S.time) + " — you reach " + DATA.LOCATIONS[to].name + ". (" + cost + " min from " + (fromName) + ")");
    this.save();
    UI.render();
  },

  setLocSilent(loc){ S.loc = loc; },

  /* ---------------- wrappers used by story actions ---------------- */
  lockerScene(){ return STORY.lockerScene(); },
  benchVisit(){ return STORY.benchVisit(); },

  /* ---------------- dialogue ---------------- */
  openDialog(id){
    const w = charWhere(id);
    if(!w || !w.talkable){
      const loc = DATA.LOCATIONS[w && w.loc ? w.loc : S.loc];
      return { kicker:"Unavailable", title:DATA.CHARS[id].name, text:"Not here, or not now. ("+(w? w.note:"—")+")", opts:[{label:"OK", cost:0, close:true}] };
    }
    const node = STORY.DIALOG[id]();
    return node;
  },

  talkTo(id, viaPhone){
    const d = STORY.DIALOG[id];
    if(!d){ UI.toast("The number rings into nothing.", true); return; }
    UI.showScene(d());
  },

  /* ---------------- phone ---------------- */
  callChar(id){
    const cost = 5;
    if(!this.canAfford(cost)){ UI.toast("No time left even for hello.", true); return; }
    const name = id==="UNKNOWN" ? "Unknown number" : DATA.CHARS[id].name;
    this.advance(cost);
    let result;
    if(id==="alex"){
      S.callLog.push({t:S.time, who:"out", id:"alex"});
      if(S.time < h(15,50)){
        setF("called_alex");
        feedAdd("sys","05 min — you call Alex. Switched off. You try twice, because that's what the phrase 'switched off' is for.");
        result = "engaged tone, then: 'The customer is unavailable.' You leave no message. The silence refuses to be Printable.";
      } else {
        result = "engaged, then dead. Alex's phone is somewhere it plans to stay.";
      }
    } else {
      const w = charWhere(id);
      S.callLog.push({t:S.time, who:"out", id:id});
      if(w && w.talkable){
        feedAdd("sys","05 min — call to "+name+". They pick up.");
        this.talkTo(id, true);
        UI.render();
        return;
      } else {
        result = name+" doesn't answer. ("+(w? w.note:"beyond reach")+")";
        feedAdd("sys","05 min — call to "+name+": no answer.");
      }
    }
    UI.showScene({ title:"Call — "+name, text:result });
    UI.render();
  },

  sendMessage(id, text){
    if(!this.canAfford(1)){ UI.toast("Not even one minute left.", true); return; }
    S.time += 1;
    (S.msgs[id]=S.msgs[id]||[]).push({t:S.time, who:"me", text:text});
    feedAdd("sys","Sent a message to "+(id==="UNKNOWN"?"an unknown number":DATA.CHARS[id].name)+".");
    const reply = this.autoReply(id);
    if(reply){ msgIn(id, reply); feedAdd("sys","Reply from "+DATA.CHARS[id].name+"."); }
    this.fireEvents();
    this.save();
    UI.render();
  },

  autoReply(id){
    if(id==="sofia" && !has("sofia_reply1") && (S.time<h(14)||S.time>=h(19))){
      setF("sofia_reply1");
      return "on shift. if this is about alex: clinic. please not over text.";
    }
    if(id==="mara" && S.time>=h(20,45)) return "home. tomorrow, ok? whatever today was."
    if(id==="jonas" && S.time<h(19)) return "in meetings. call the office if it's actually important.";
    if(id==="nadia") return "typing. send anything solid and it rides tonight's front.";
    if(id==="elio") return "at the counter, as usual. come by.";
    if(id==="alex") return null;
    return null;
  },

  /* ---------------- waiting ---------------- */
  wait(mins){
    feedAdd("sys","You let "+mins+" minutes go where minutes go.");
    this.advance(mins);
    this.save();
    UI.render();
  },

  /* ---------------- locker code ---------------- */
  tryCode(code){
    if(code === "2311"){
      setF("opened_locker"); setF("has_document"); giveClue("manifest_seen"); giveClue("locker_full");
      const txt="2311. The pad's light turns the green of permission.\n\nInside box 14: a folder labelled in Alex's square capitals — 'IN CASE I'M WRONG'. Duplicate customs manifests, re-stamped numbers, crossed-out consignees. Two photographs: Brandt and Sera in the yard at night. A clinic receipt — Sofia Lark, 03:12 last night.\n\nThe night acquires shape, and the shape has your friend's handwriting on it.";
      UI.showScene({ title:"Box 14", text:txt });
    } else {
      S.flags.codeTries = (S.flags.codeTries||0)+1;
      this.advance(5);
      if(S.ending) return;
      const tries = S.flags.codeTries;
      let txt;
      if(tries>=3 && !has("elio_favor")){
        txt="Third wrong code. The box locks down for the day with bureaucratic finality, and Elio has to walk over with his master key and a face you will be footing the bill for. \"Try remembering better,\" he suggests, not unkindly, and logs it.\n\nBox 14 is closed to you until tomorrow. Tomorrow, of course, is a long way from tonight.";
        setF("locker_blocked");
      } else if(tries>=3 && has("elio_favor")){
        setF("opened_locker"); setF("has_document"); giveClue("manifest_seen"); giveClue("locker_full");
        txt="Third wrong code. Elio arrives with the master key and a very dry expression. \"Remember when I said today there's a word between us?\" The key turns. \"Now there's also a favor squared.\"\n\nInside box 14: the folder — 'IN CASE I'M WRONG' — the manifests, two photographs, and a clinic receipt with Sofia's name and 03:12 on it.";
      } else {
        txt = "The light shrugs red. " + (tries===1 ? "One wrong code, five minutes, and a machine that will remember both." : "Second mistake. The clerk's eyebrow is now involved.");
      }
      UI.showScene({ title:"Box 14", text:txt });
    }
    this.save();
    UI.render();
  },

  /* ---------------- meeting windows ---------------- */
  meetingAvailable(){
    if(S.time < h(22,45) || S.time > h(23,59)) return false;
    if(S.flags.met_alex) return false;
    if(has("brandt_told") && has("knows_station_meet")) return S.loc==="station";
    if(has("brandt_told") && !has("knows_station_meet")) return S.loc==="riverside";
    if(has("knows_quiet_place")) return S.loc==="riverside";
    return false;
  },

  runMeeting(kind){
    if(!this.canAfford(8)){ UI.toast("Even waiting has a price, and you can't pay it.", true); return; }
    const node = kind==="hall" ? STORY.meetingHall() : STORY.meetingBench();
    if(node && node.ending){ Engine.finishEnding(node.ending); return; }
    UI.showScene(node);
  },

  /* ---------------- endings ---------------- */
  finishEnding(forced){
    const id = forced || STORY.evaluateEnding();
    S.ending = id;
    UI.endingScreen(id);
    this.archive();
    try{ localStorage.removeItem("24h_save"); }catch(e){}
  },

  reachMidnight(){
    S.time = 1440;
    feedAdd("sys","24:00 — Midnight. The day ends the way it always does: completely.");
    this.finishEnding(null);
  },

  archive(){
    try{
      const arch = JSON.parse(localStorage.getItem("24h_archive")||"[]");
      const found = Object.keys(S.clues).length;
      const total = Object.keys(DATA.CLUES).length;
      arch.push({
        when: new Date().toISOString(),
        ending: S.ending,
        endingTitle: STORY.ENDINGS[S.ending].title,
        endingNum: STORY.ENDINGS[S.ending].num,
        cluesFound: found, clueTotal: total,
        clues: Object.keys(S.clues),
        missed: S.missed.slice(),
        feed: S.feed.filter(f=>f.kind==="important"||f.kind==="sys").slice(-16),
        metAlex: !!S.flags.met_alex,
        met: Object.keys(DATA.CHARS).filter(function(c){ return S.rel[c]!==undefined && c!=="alex"; })
      });
      while(arch.length>12) arch.shift();
      localStorage.setItem("24h_archive", JSON.stringify(arch));
    }catch(e){}
  }
};

</script>
<script>
/* ============================================================
   24 HOURS — UI layer
   ============================================================ */
"use strict";

const UI = {
  el: function(id){ return document.getElementById(id); },
  selTo:null, phoneTab:"contacts", phoneThread:null, journalTab:"clues",

  /* ---------------- navigation ---------------- */
  show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden")); this.el(id).classList.remove("hidden"); },
  showMenu(){ this.show("screen-menu"); this.refreshMenu(); },
  showGame(){ this.show("screen-game"); },

  refreshMenu(){
    this.el("btn-continue").classList.toggle("hidden", !Engine.hasSave());
    this.el("btn-newdayplus").classList.toggle("hidden", !this.loadArchive().length);
    const arch=this.loadArchive();
    this.el("menu-clock").textContent = arch.length ? fmt(h(23,59)) : "08:00";
  },

  /* ---------------- toast ---------------- */
  toast(msg, bad){
    const zone=this.el("toast-zone");
    const d=document.createElement("div");
    d.className="toast"+(bad?" bad":"");
    d.textContent=msg;
    zone.appendChild(d);
    setTimeout(function(){ d.remove(); }, 3400);
  },

  /* ---------------- intro ---------------- */
  introOverlay(lines){
    const box=this.el("overlay-box");
    box.className="";
    box.innerHTML='<div class="ov-kicker">24 HOURS — VESPERA</div><div id="intro-lines"></div><button id="intro-go" class="btn ov-continue hidden">BEGIN THE DAY</button>';
    document.getElementById("overlay").classList.remove("hidden");
    const holder=box.querySelector("#intro-lines");
    let i=0;
    const next=function(){
      if(i>=lines.length){
        document.getElementById("intro-go").classList.remove("hidden");
        return;
      }
      const L=lines[i++];
      const div=document.createElement("div");
      div.className="intro-line "+(L[0]==="sys"||L[0]==="ACTION"?"sys":(L[0]==="speaker"?"speaker":""));
      div.textContent = L[0]==="speaker" ? "— "+L[1]+" —" : L[1];
      holder.appendChild(div);
      holder.scrollTop=holder.scrollHeight;
      setTimeout(next, L[0]==="ACTION"?1000:1500);
    };
    next();
    document.getElementById("intro-go").onclick=function(){
      document.getElementById("overlay").classList.add("hidden");
    };
  },

  /* ---------------- scene overlay (dialog system) ---------------- */
  showScene(node){
    const ov=document.getElementById("overlay");
    const box=this.el("overlay-box");
    box.className="";
    ov.classList.remove("hidden");

    let html="";
    if(node.kicker) html+='<div class="ov-kicker">'+node.kicker+'</div>';
    if(node.title) html+='<div class="ov-title">'+node.title+'</div>';
    if(node.text) html+='<div class="ov-text">'+node.text.replace(/\n/g,"<br>")+'</div>';

    if(node.codePad){
      html+='<div class="ov-opts"><div class="ov-padwrap" style="cursor:default; display:block;">'
          +  '<div style="display:flex; gap:.5rem; justify-content:center;">';
      for(let i=0;i<4;i++) html+='<input class="code-in" data-i="'+i+'" maxlength="1" inputmode="numeric" style="width:52px; font-size:1.6rem; text-align:center; font-family:monospace; background:#0a0d13; color:var(--accent); border:1px solid var(--line); border-radius:4px; padding:.4rem 0;">';
      html+='</div><div style="text-align:center; margin-top:.8rem;">'
          + '<button id="code-ok" class="btn">ENTER</button> '
          + '<button id="code-no" class="btn">STEP BACK</button></div>'
          + (node.options_note?'<div class="dim" style="font-size:.7rem; margin-top:.7rem; text-align:center;">'+node.options_note+'</div>':'')
          + '</div></div>';
    }

    if(node.opts && node.opts.length){
      html+='<div class="ov-opts">';
      node.opts.forEach(function(o,idx){
        if(o.if && !o.if(S)) return;
        html+='<div class="ov-opt" data-opt="'+idx+'">'
            + '<main>'+o.label+(o.sub?'<small>'+o.sub+'</small>':'')+'</main>'
            + (o.cost>0?'<span class="a-cost">− '+o.cost+' MIN</span>':'')
            + '</div>';
      });
      html+='</div>';
    }
    if(node.farewell && !node.codePad) html+='<div class="dim" style="font-size:.75rem; font-style:italic; margin-top:1rem;">'+node.farewell+'</div>';
    if(node.deadlineNote) html+='<div class="deadline-note">'+node.deadlineNote+'</div>';
    if((!node.opts || !node.opts.filter(function(o){return !o.if||o.if(S);}).length) && !node.codePad){
      html+='<button id="ov-close" class="btn ov-continue">'+(node.closeLabel||"CONTINUE")+'</button>';
    }
    box.innerHTML=html;

    const self=this;
    box.querySelectorAll(".ov-opt").forEach(function(el){
      el.addEventListener("click", function(){
        const idx=parseInt(el.getAttribute("data-opt"),10);
        const o=node.opts ? node.opts[idx] : undefined;
        if(!o){ console.warn("opt resolve miss", idx, node.title, !!(node.opts)); return; }
        if(o.cost>0 ){ if(!Engine.canAfford(o.cost)){ UI.toast("Not enough time left for that.",true); return; } Engine.advance(o.cost); }
        if(o.close){ self.closeScene(); return; }
        if(S.ending){ return; }
        let res=null;
        try{ res = o.pick ? o.pick() : null; }catch(err){ console.error(err); }
        if(res==null){ self.closeScene(); return; }
        if(typeof res==="string"){ self.showResult(res, node); return; }
        if(res.node){ self.showScene(res.node); return; }
        if(res.ending){ Engine.finishEnding(res.ending); return; }
        self.showScene(res);
      });
    });

    const okBtn=box.querySelector("#code-ok");
    if(okBtn){
      const ins=box.querySelectorAll(".code-in");
      ins.forEach(function(inp,k){
        inp.addEventListener("input", function(){ if(inp.value.length>1) inp.value=inp.value.slice(0,1); if(inp.value && k<3) ins[k+1].focus(); });
        inp.addEventListener("keydown", function(ev){ if(ev.key==="Enter") okBtn.click(); });
      });
      ins[0].focus();
      okBtn.onclick=function(){
        let code=""; ins.forEach(function(i){ code+=i.value; });
        if(code.length<4){ UI.toast("Four digits. The machine is strict.",true); return; }
        Engine.tryCode(code);
      };
      box.querySelector("#code-no").onclick=function(){ self.closeScene(); };
    }

    const closeBtn=box.querySelector("#ov-close");
    if(closeBtn){
      closeBtn.onclick=function(){
        if(node.ending){ Engine.finishEnding(node.ending); return; }
        if(node.endingSignal){ Engine.finishEnding(null); return; }
        self.closeScene();
      };
    }
  },

      box.appendChild(d);
    });

    const box=this.el("overlay-box");
    box.className="";
    box.innerHTML='<div class="ov-kicker">PAUSED — the city waits for no one, but you can</div>'
      + '<div class="ov-title">PAUSE</div>'
      + '<button id="p-resume" class="btn btn-lg">RESUME</button>'
      + '<button id="p-restart" class="btn btn-lg">RESTART THE DAY</button>'
      + '<button id="p-settings" class="btn btn-lg">SETTINGS</button>'
      + '<button id="p-menu" class="btn btn-lg">MAIN MENU</button>';
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("p-resume").onclick=function(){ UI.closeOverlay(); };
    document.getElementById("p-menu").onclick=function(){ UI.closeOverlay(); UI.showMenu(); };
    document.getElementById("p-settings").onclick=function(){ UI.settingsScreen(); };
    document.getElementById("p-restart").onclick=function(){
      if(!confirm("Restart the day? Today's progress will be lost.")) return;
      UI.closeOverlay(); Engine.wipe(); Engine.newGame(false);
    };
  },

  /* ---------------- menu Screens ---------------- */
  archiveScreen(){
    const box=this.el("overlay-box");
    box.className="";
    const arch=this.loadArchive();
    let body;
    if(!arch.length) body='<div class="dim">No days archived yet. Midnight hasn\'t happened to you.</div>';
    else{
      body='<div style="max-height:50vh; overflow-y:auto;">';
      arch.slice().reverse().forEach(function(r){
        body+='<div class="char-card"><h4>'+r.endingNum+' — '+r.endingTitle+' <span class="dim" style="font-size:.6rem;">'+(r.when||"").slice(0,10)+'</span></h4>'
            + '<div class="cc-loc">CLUES: '+r.cluesFound+' / '+r.clueTotal+(r.metAlex?" · MET ALEX":" · ALONE AT MIDNIGHT")+'</div>'
            + (r.missed && r.missed.length ? '<div class="cc-bio dim" style="font-size:.7rem;">MISSED:<br>· '+r.missed.slice(0,5).join("<br>· ")+'</div>':'')
            + '</div>';
      });
      body+='</div>';
    }
    box.innerHTML='<div class="ov-kicker">DAY ARCHIVE</div><div class="ov-title">EVERY MIDNIGHT, ANOTHER VESPERA</div>'+body
      + '<button id="arch-x" class="btn ov-continue">BACK</button>';
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("arch-x").onclick=function(){ UI.closeOverlay(); UI.showMenu(); };
  },

  settingsScreen(){
    const box=this.el("overlay-box");
    box.className="";
    box.innerHTML='<div class="ov-kicker">SETTINGS</div><div class="ov-title">CONFIGURE THE DAY</div>'
      + '<div class="set-row"><span>Discrete time simulation</span><span class="note">time only advances with actions (always on)</span></div>'
      + '<div class="set-row"><span>Autosave</span><span class="note">every action (always on)</span></div>'
      + '<div class="set-row"><span>New Day+ memories</span><span class="note">journal carried across runs (automatic)</span></div>'
      + '<button id="set-wipe" class="btn btn-lg" style="margin-top:1rem;">WIPE ALL DATA</button>'
      + '<button id="set-x" class="btn btn-lg">BACK</button>';
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("set-wipe").onclick=function(){
      if(!confirm("Erase saves AND the day archive? This cannot be undone.")) return;
      try{ localStorage.removeItem("24h_save"); localStorage.removeItem("24h_archive"); }catch(e){}
      S=null; UI.refreshMenu(); UI.closeOverlay(); UI.showMenu();
    };
    document.getElementById("set-x").onclick=function(){ UI.closeOverlay(); UI.showMenu(); };
  },

  creditsScreen(){
    const box=this.el("overlay-box");
    box.className="";
    box.innerHTML='<div class="ov-kicker">CREDITS</div><div class="ov-title">24 HOURS</div>'
      + '<div class="ov-text">Design, writing, code and graphics:\none late October.\n\nEngine: discrete-time scheduler, no external dependencies.\nCity: Vespera — entirely fictional; any resemblance to cities you failed to live in is intentional.\n\nPart of a three-game collection about different kinds of impossible:\nThe Impossible Room — spatial problems.\nFalse Memory — truth vs. perception.\n24 Hours — time, opportunity, consequence.</div>'
      + '<button id="cred-x" class="btn ov-continue">BACK</button>';
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("cred-x").onclick=function(){ UI.closeOverlay(); UI.showMenu(); };
  },

  /* ---------------- ending screen ---------------- */
  endingScreen(id){
    const box=this.el("overlay-box");
    const E=STORY.ENDINGS[id];
    const ev=E.text();
    const fates=E.fates();
    const found=Object.keys(S.clues);
    const total=Object.keys(DATA.CLUES).length;
    const unDisc=Object.keys(DATA.CLUES).filter(function(c){ return !S.clues[c]; });
    box.className="ending";
    let html='<div class="ending-id">'+E.num+' — '+E.title+'</div>'
      + '<div class="ov-title" style="font-size:1.4rem;">MIDNIGHT, VESPERA</div>'
      + '<div class="ov-text" style="line-height:1.8;">'+ev.replace(/\n/g,"<br><br>")+'</div>'
      + '<div class="epi-chars" style="white-space:pre-wrap;">'+fates+'</div>'
      + '<div class="ending-stats">CLUES RECOVERED: <b>'+found.length+' / '+total+'</b>'+(has("told_anything")?"":"")+'<br>'
      + 'MET ALEX: <b>'+(S.flags.met_alex?"YES":"NO")+'</b> · EVIDENCE: <b>'+(S.flags.doc_sold?"SOLD":(S.flags.has_document||S.flags.opened_locker?"IN YOUR HANDS":(S.flags.brandt_told?"COMPROMISED":"UNFOUND")))+'</b>'
      + (S.memories&&S.memories.length?"<br>MEMORIES CARRIED: "+S.memories.length:"")+'</div>'
      + '<button id="end-arch" class="btn btn-lg">DAY ARCHIVE</button>'
      + '<button id="end-plus" class="btn btn-lg btn-gold">NEW DAY+ (KEEP THE JOURNAL)</button>'
      + '<button id="end-menu" class="btn btn-lg">MAIN MENU</button>'
      + '<div class="ov-kicker" style="margin-top:1.2rem;">WHAT YOU NEVER FOUND</div>'
      + '<ul class="missed-list">'+unDisc.map(function(c){ return '<li>'+DATA.CLUES[c].title+'</li>'; }).join("") + (S.missed.length?"<li>…and "+S.missed.length+" live moment"+(S.missed.length>1?"s":"")+" that passed without you: see the archive.</li>":"") +'</ul>';
    box.innerHTML=html;
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("end-arch").onclick=function(){ UI.archiveScreen(); };
    document.getElementById("end-plus").onclick=function(){ UI.closeOverlay(); Engine.wipe(); Engine.newGame(true); };
    document.getElementById("end-menu").onclick=function(){ UI.closeOverlay(); UI.showMenu(); };
  },

  /* ---------------- archive storage ---------------- */
  loadArchive(){ try{ return JSON.parse(localStorage.getItem("24h_archive")||"[]"); }catch(e){ return []; } }
};

</script>
<script>
/* ============================================================
   24 HOURS — self-test harness (?test=1 in browser, or node)
   ============================================================ */
"use strict";

const TestRunner = {
  results: [],

  check(name, fn){
    try{
      const r = fn();
      this.results.push({ name:name, ok:r!==false, info:r===true?"":String(r) });
    }catch(e){
      this.results.push({ name:name, ok:false, info:e.message });
    }
  },

  /* simulated minimal DOM/localStorage so logic tests run headless too */
  stubEnv(){
    if(typeof document!=="undefined") return false;
    global.localStorage = { _m:{}, getItem(k){ return this._m[k]||null; }, setItem(k,v){ this._m[k]=v; }, removeItem(k){ delete this._m[k]; } };
    function fakeEl(){
      const el={ classList:{add(){},remove(){},toggle(){},contains(){return true;}}, innerHTML:"", textContent:"", style:{},
        appendChild(){}, setAttribute(){}, getAttribute(){return null;}, addEventListener(){}, focus(){}, scrollTop:0, scrollHeight:0,
        querySelectorAll(){ return []; }, value:"" };
      el.querySelector=function(sel){ return (el.innerHTML.indexOf(String(sel).slice(1))>=0) ? fakeEl() : null; };
      return el;
    }
    global.document = { getElementById(){ return fakeEl(); },
      querySelector(){ return fakeEl(); }, querySelectorAll(){ return []; }, addEventListener(){}, createElement(){ return fakeEl(); } };
    global.document.body = fakeEl();
    global.window = { addEventListener(){}, location:{search:""} };
    return true;
  },

  run(){
    this.stubEnv();
    const T=this;

    /* --- data integrity --- */
    T.check("Travel matrix symmetric", function(){
      for(const a in DATA.MATRIX){
        for(const b in DATA.MATRIX[a]){
          if(DATA.MATRIX[b][a]!==undefined && DATA.MATRIX[b][a]!==DATA.MATRIX[a][b]) return false;
        }
      } return true;
    });
    T.check("Travel matrix complete", function(){
      const ids=Object.keys(DATA.LOCATIONS);
      for(const a of ids){ if(DATA.MATRIX[a][a]!==undefined) return false;
        for(const b of ids){ if(a!==b && DATA.MATRIX[a][b]===undefined) return a+"->"+b; } }
      return true;
    });
    T.check("Schedules: valid locations", function(){
      for(const c in DATA.SCHED){
        for(const b of DATA.SCHED[c]) if(!DATA.LOCATIONS[b[2]]) return c+": "+b[2];
      } return true;
    });
    T.check("Schedules: sorted, non-overlapping, full-day", function(){
      for(const c in DATA.SCHED){
        const bl=DATA.SCHED[c];
        if(bl[0][0]!==0) return c+" starts late";
        let prevEnd=0;
        for(const b of bl){
          if(b[0]!==prevEnd) return c+" gap at "+fmt(b[0]);
          if(b[1]<=b[0]) return c+" bad block";
          prevEnd=b[1];
        }
        if(prevEnd!==h(24,0)) return c+" ends early";
      } return true;
    });
    T.check("Event ids unique", function(){
      const seen={};
      for(const e of STORY.EVENTS){ if(seen[e.id]) return e.id; seen[e.id]=true; } return true;
    });
    T.check("Events time-sorted", function(){
      let last=0;
      for(const e of STORY.EVENTS){ if(e.t<last) return e.id; last=e.t; } return true;
    });
    T.check("Every character has a dialogue", function(){
      for(const c in DATA.CHARS){ if(c==="alex") continue; if(!STORY.DIALOG[c]) return c; } return true;
    });
    T.check("Every action ref valid id", function(){
      for(const loc in STORY.ACTIONS){
        if(!DATA.LOCATIONS[loc]) return loc;
        for(const a of STORY.ACTIONS[loc]){
          const keys=["run","cond","once","hours","lockersOnly","id","label","sub","cost"];
          for(const k of keys){} 
          if(typeof a.run!=="function") return loc+"/"+a.id+" no run";
        }
      } return true;
    });
    T.check("Endings defined (6)", function(){
      const need=["truth","too_late","wrong_person","alternative","sacrifice","unknown"];
      for(const n of need) if(!STORY.ENDINGS[n]) return n; return true;
    });

    /* --- reachability of all six endings via state injection --- */
    const scenarios = {
      truth:        { flags:{ met_alex:true, fraud_link:true, jonas_debt:true, final_press:true } },
      alternative:  { flags:{ met_alex:true, fraud_link:true, publish:true } },
      wrong_person: { flags:{ met_alex:true, doc_sold:true } },
      sacrifice:    { flags:{ met_alex:true, helped_mara_night:true } },
      too_late:     { flags:{ knows_quiet_place:true } },
      unknown:      { flags:{ } }
    };
    T.check("All 6 endings reachable & distinct", function(){
      const got={};
      for(const k in scenarios){
        S = Engine.DEFAULTS();
        S.flags = scenarios[k].flags;
        const id = STORY.evaluateEnding();
        if(!STORY.ENDINGS[id]) return k+" -> missing ending "+id;
        got[id]=true;
        const txt = STORY.ENDINGS[id].text();
        if(typeof txt!=="string" || txt.length<100) return id+": bad epilogue";
        if(typeof STORY.ENDINGS[id].fates()!=="string") return id+": bad fates";
      }
      return Object.keys(got).length===6 ? true : "only "+Object.keys(got).length+" endings matched";
    });

    /* --- full-day headless simulation --- */
    T.check("Full day sim: time engine & events", function(){
      S = Engine.DEFAULTS();
      S.flags.fraud_link = true; // so the fence is marked known
      const order=[];
      for(let t=h(8,0); t<h(23,0); t+=7){ S.time=t; }
      S = Engine.DEFAULTS();
      // passive day: wait in 15-min chunks from 08:00 to midnight
      let steps=0;
      while(S.time<1440 && steps<120){
        steps++;
        const before=S.time;
        // stay at riverside for bench visit, then at key spots
        if(before<h(10,0)){ S.loc="apartment"; }
        else if(before<h(12,0)){ S.loc="station"; }
        else if(before<h(16,0)){ S.loc="oldtown"; }
        else if(before<h(20,0)){ S.loc="business"; }
        else { S.loc="riverside"; }
        const ok = Engine.advance(Math.min(15, Math.max(1, 1440-S.time)));
        if(!ok || S.ending){ break; }
        order.push(before);
      }
      if(steps>=120 && S.time<1440) return "cannot advance: time="+fmt(S.time);
      if(!S.ending) return "no ending at midnight (t="+fmt(S.time)+")";
      return true;
    });

    /* --- time cost sanity --- */
    T.check("Actions always cost time", function(){
      for(const loc in STORY.ACTIONS){
        for(const a of STORY.ACTIONS[loc]){
          if(typeof a.cost!=="number" || a.cost<=0) return loc+"/"+a.id+" cost="+a.cost;
        }
      } return true;
    });
    T.check("Locker code guard: wrong codes consumed", function(){
      S=Engine.DEFAULTS(); S.flags.knows_locker=true; S.flags.codeTries=0;
      S.time=h(10,0);
      Engine.tryCode("0000"); Engine.tryCode("0000");
      if(S.flags.codeTries!==2) return "tries not counted";
      return true;
    });
    T.check("Midnight block: no action past 24:00", function(){
      S=Engine.DEFAULTS(); S.time=1435;
      if(Engine.canAfford(10)) return "allowed to overshoot";
      return true;
    });

    /* --- report --- */
    const fails=this.results.filter(r=>!r.ok);
    const report = this.results.map(function(r){ return (r.ok?"PASS":"FAIL")+"  "+r.name+(r.ok?"":"  → "+r.info); }).join("\n");
    console.log("=== 24 HOURS SELF-TEST ===\n"+report+"\n"+(fails.length? fails.length+" FAILURES" : "ALL TESTS PASSED"));

    if(typeof document!=="undefined"){
      const box=document.getElementById("overlay-box");
      box.className="";
      box.innerHTML='<div class="ov-kicker">24 HOURS — SELF-TEST</div>'
        + '<div class="ov-text" style="font-family:monospace; font-size:.72rem; white-space:pre-wrap;">'+report.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'\n\n'+(fails.length? fails.length+" FAILURES":"ALL TESTS PASSED")+'</div>'
        + '<button class="btn ov-continue" onclick="document.getElementById(\'overlay\').classList.add(\'hidden\')">CLOSE</button>';
      document.getElementById("overlay").classList.remove("hidden");
    }
    return fails.length===0;
  }
};

</script>
<script>
/* ============================================================
   24 HOURS — boot & menu wiring
   ============================================================ */
"use strict";

const Main = {
  boot(){
    document.getElementById("btn-new").onclick=function(){ Engine.newGame(false); };
    document.getElementById("btn-continue").onclick=function(){ if(!Engine.load()) UI.toast("No save found.", true); };
    document.getElementById("btn-newdayplus").onclick=function(){ Engine.newGame(true); };
    document.getElementById("btn-archive").onclick=function(){ UI.archiveScreen(); };
    document.getElementById("btn-settings").onclick=function(){ UI.settingsScreen(); };
    document.getElementById("btn-credits").onclick=function(){ UI.creditsScreen(); };

    document.getElementById("btn-phone").onclick=function(){ UI.openPhone(); };
    document.getElementById("btn-journal").onclick=function(){ UI.openJournal(); };
    document.getElementById("btn-pause").onclick=function(){ UI.pause(); };

    document.getElementById("btn-go").onclick=function(){
      if(!UI.selTo || UI.selTo===S.loc) return;
      Engine.travel(UI.selTo);
      UI.render();
    };

    document.addEventListener("keydown", function(ev){
      const overlayOpen = !document.getElementById("overlay").classList.contains("hidden");
      if(ev.key==="Escape"){
        if(overlayOpen){ UI.closeOverlay(); }
        return;
      }
      if(overlayOpen || !S || S.ending) return;
      if(ev.key==="p"||ev.key==="P") UI.openPhone();
      if(ev.key==="j"||ev.key==="J") UI.openJournal();
    });

    UI.showMenu();
    if(window.location.search.indexOf("test=1")>=0){
      setTimeout(function(){ TestRunner.run(); }, 300);
    }
  }
};

window.addEventListener("load", function(){ Main.boot(); });

</script>
