<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 HOURS — Vespera</title>
<style>
/* ================= 24 HOURS — visual identity ================= */
:root{
  --ink:#e8e4da; --dim:#9a948a; --line:#2a2e3a; --panel:#12151d; --panel2:#0c0f16;
  --gold:#ffb454; --accent:#ffb454; --bg0:#0a0c12; --bg1:#10131c; --good:#7ec8a0; --bad:#e0705e;
  font-size:16px;
}
body[data-phase="morning"]  { --accent:#ffcf7d; --bg0:#171310; --bg1:#1e1a16; }
body[data-phase="afternoon"]{ --accent:#d8d3c4; --bg0:#121317; --bg1:#171a21; }
body[data-phase="evening"]  { --accent:#ff9448; --bg0:#191018; --bg1:#221420; }
body[data-phase="night"]    { --accent:#6f9bd6; --bg0:#06070c; --bg1:#0b0e18; }

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:linear-gradient(160deg,var(--bg0),var(--bg1) 70%);
  color:var(--ink);
  font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  transition: background 2s ease, color 2s ease;
  overflow:hidden;
  user-select:none;
}
.hidden{display:none !important;}
.dim{color:var(--dim);}
.btn{
  background:transparent; color:var(--ink); border:1px solid var(--line);
  padding:.55rem 1rem; font:inherit; letter-spacing:.08em; cursor:pointer;
  text-transform:uppercase; font-size:.78rem; border-radius:3px;
  transition:all .15s ease; position:relative;
}
.btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
.btn:disabled{ opacity:.35; cursor:default; }
.btn-gold{ border-color:var(--gold); color:var(--gold); }
.btn-gold:hover{ background:var(--gold); color:#0a0c12; }
.btn-lg{ display:block; width:280px; margin:.45rem auto; padding:.7rem 1rem; font-size:.85rem; }
.btn-icon{ width:38px; height:34px; padding:.2rem; font-size:.95rem; }
.men-note{display:block; font-size:.6rem; letter-spacing:.15em; color:var(--dim); text-transform:uppercase; margin-top:2px;}

/* ---------- screens ---------- */
.screen{position:absolute; inset:0; display:flex; flex-direction:column;}

/* ---------- main menu ---------- */
#screen-menu{ align-items:center; justify-content:center; }
.menu-bg{
  position:absolute; inset:0; opacity:.9;
  background:
    radial-gradient(1200px 500px at 70% 110%, rgba(255,148,72,.14), transparent 60%),
    radial-gradient(900px 400px at 20% -10%, rgba(111,155,214,.10), transparent 60%),
    linear-gradient(180deg,#06070c,#101321 55%,#1a141c);
}
.menu-bg::after{
  content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  pointer-events:none;
}
.menu-inner{ position:relative; text-align:center; z-index:1; }
.menu-clock{
  font-family:"Consolas","Menlo",monospace; font-size:3.4rem; letter-spacing:.18em;
  color:var(--gold); text-shadow:0 0 24px rgba(255,180,84,.35); margin-bottom:.2rem;
  animation:clockPulse 4s ease-in-out infinite;
}
@keyframes clockPulse{ 0%,100%{opacity:.85;} 50%{opacity:1;} }
.menu-title{ font-weight:200; font-size:2.6rem; letter-spacing:.55em; text-indent:.55em; color:var(--ink); }
.menu-sub{ color:var(--dim); letter-spacing:.22em; text-transform:uppercase; font-size:.68rem; margin:.5rem 0 2rem; }
.menu-hint{ color:var(--dim); font-size:.72rem; font-style:italic; margin-top:2.2rem; letter-spacing:.06em;}

/* ---------- HUD ---------- */
#hud{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:.55rem 1rem; border-bottom:1px solid var(--line);
  background:rgba(8,10,15,.72); backdrop-filter:blur(6px); z-index:5;
}
.hud-left{ display:flex; gap:.9rem; align-items:center; }
#hud-clock{
  font-family:"Consolas",monospace; font-size:1.9rem; letter-spacing:.1em; color:var(--accent);
  text-shadow:0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); min-width:110px;
}
#hud-date{ font-size:.6rem; letter-spacing:.22em; color:var(--dim); }
#hud-phase{ font-size:.66rem; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); }
.hud-center{ flex:1; max-width:560px; }
.hud-bar{ height:8px; background:#05060a; border:1px solid var(--line); border-radius:4px; position:relative; overflow:hidden;}
#hud-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%, #fff0)); transition:width .6s ease; }
#hud-hazards{ position:absolute; top:0; bottom:0; left:0; right:0; pointer-events:none; }
#hud-hazards .hz{ position:absolute; top:-1px; bottom:-1px; width:2px; background:var(--bad); box-shadow:0 0 6px var(--bad); opacity:.9; }
.hud-bar-label{ display:flex; justify-content:space-between; font-size:.58rem; letter-spacing:.16em; color:var(--dim); margin-top:3px; font-family:"Consolas",monospace; }
.hud-right{ text-align:right; display:flex; gap:.8rem; align-items:center; }
#hud-location{ font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--ink); }
.hud-btns{ display:flex; gap:.35rem; }

/* ---------- game body ---------- */
#game-body{ flex:1; display:grid; grid-template-columns: 360px 1fr 300px; min-height:0; }
#panel-map{ display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0;}
#map-wrap{ flex:1; min-height:0; padding:8px; }
#map{ width:100%; height:100%; }
#map-side{ border-top:1px solid var(--line); padding:.7rem .9rem; min-height:110px; }
#map-side-info{ font-size:.8rem; line-height:1.5; min-height:64px; color:var(--ink);}
#map-side-info b{ color:var(--accent); }
#btn-go{ margin-top:.5rem; width:100%; }

#panel-scene{ display:flex; flex-direction:column; min-height:0; overflow:hidden;}
#scene-head{ padding:1rem 1.4rem .2rem; }
#scene-loc-name{ font-size:1.25rem; font-weight:600; letter-spacing:.34em; text-transform:uppercase; }
#scene-loc-hours{ font-size:.66rem; letter-spacing:.2em; margin-top:2px; font-family:"Consolas",monospace;}
#scene-desc{ padding:.8rem 1.4rem; color:var(--dim); font-size:.86rem; line-height:1.65; max-width:70ch; font-style:italic;}
#scene-people{ padding:0 1.4rem; display:flex; flex-wrap:wrap; gap:.5rem; }
.person-chip{ border:1px solid var(--line); border-left:3px solid var(--accent); padding:.3rem .6rem; font-size:.7rem; letter-spacing:.1em; border-radius:3px; background:rgba(255,255,255,.02); }
#scene-actions{ padding:.9rem 1.2rem 1.4rem; overflow-y:auto; display:flex; flex-direction:column; gap:.5rem;}
.action{
  border:1px solid var(--line); background:rgba(255,255,255,.02); border-radius:4px;
  padding:.6rem .9rem; cursor:pointer; transition:all .13s ease; display:flex; justify-content:space-between; gap:1rem; align-items:baseline;
}
.action:hover:not(.locked){ border-color:var(--accent); background:rgba(255,180,84,.05); }
.action.locked{ opacity:.4; cursor:default; }
.action .a-label{ font-size:.85rem; letter-spacing:.05em; }
.action .a-sub{ display:block; font-size:.68rem; color:var(--dim); margin-top:2px; font-style:italic;}
.action .a-cost{ font-family:"Consolas",monospace; color:var(--accent); font-size:.72rem; white-space:nowrap; letter-spacing:.05em;}
.action.special{ border-left:3px solid var(--gold); }
.action.person{ border-left:3px solid #7ec8a0; }
.action .rel{ color:#7ec8a0; font-size:.6rem; letter-spacing:.15em;}

#panel-side{ display:flex; flex-direction:column; border-left:1px solid var(--line); min-height:0;}
.side-box{ padding:.8rem 1rem; border-bottom:1px solid var(--line);}
.side-box.grow{ flex:1; min-height:0; display:flex; flex-direction:column;}
.side-box h3{ font-size:.6rem; letter-spacing:.34em; color:var(--dim); text-transform:uppercase; margin-bottom:.6rem; font-weight:600;}
#objectives{ font-size .78rem; font-size:.78rem; line-height:1.7;}
.obj{ display:flex; gap:.5rem; align-items:baseline; margin-bottom:.35rem;}
.obj .dot{ color:var(--accent); }
.obj.done{ color:var(--dim); text-decoration:line-through; }
#feed{ flex:1; overflow-y:auto; font-size:.74rem; line-height:1.55; }
.feed-item{ padding:.35rem 0; border-bottom:1px dashed #1c202b; animation:feedIn .4s ease; }
.feed-item .ft{ color:var(--accent); font-family:"Consolas",monospace; font-size:.64rem; letter-spacing:.1em; margin-right:.45rem;}
.feed-item.important{ border-left:2px solid var(--gold); padding-left:.5rem; }
.feed-item.sys{ color:var(--dim); }
@keyframes feedIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1;} }

/* ---------- overlays ---------- */
.overlay{
  position:absolute; inset:0; background:rgba(4,5,9,.82); z-index:40;
  display:flex; align-items:center; justify-content:center; padding:2rem;
  animation:fade .3s ease;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
#overlay-box{
  background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  width:min(680px, 94vw); max-height:92vh; overflow-y:auto; padding:1.6rem 1.9rem;
  box-shadow:0 20px 80px rgba(0,0,0,.6); animation:pop .25s ease;
}
@keyframes pop{ from{transform:translateY(10px); opacity:0} to{transform:none; opacity:1} }
.ov-kicker{ font-size:.6rem; letter-spacing:.34em; color:var(--accent); text-transform:uppercase; margin-bottom:.7rem;}
.ov-title{ font-size:1.25rem; letter-spacing:.2em; text-transform:uppercase; margin-bottom:.9rem; font-weight:600;}
.ov-text{ font-size:.9rem; line-height:1.75; color:var(--ink); margin-bottom:1.1rem; white-space:pre-wrap; }
.ov-text .dim{ font-style:italic;}
.ov-time{ font-family:"Consolas",monospace; color:var(--accent); font-size:.72rem; letter-spacing:.15em; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:.45rem 0; margin-bottom:1rem;}
.ov-opts{ display:flex; flex-direction:column; gap:.55rem; }
.ov-opt{
  border:1px solid var(--line); padding:.7rem .9rem; border-radius:4px; cursor:pointer;
  display:flex; justify-content:space-between; gap:1rem; align-items:center; transition:all .13s ease; background:rgba(255,255,255,.02);
}
.ov-opt:hover{ border-color:var(--accent); }
.ov-opt main{ font-size:.85rem; }
.ov-opt small{ display:block; color:var(--dim); margin-top:2px; font-size:.68rem;}
.ov-opt .a-cost{ font-family:"Consolas",monospace; color:var(--accent); font-size:.72rem; white-space:nowrap;}
.ov-result{ border-left:3px solid var(--gold); background:rgba(255,180,84,.04); padding:1rem; font-size:.9rem; line-height:1.7; white-space:pre-wrap;}
.ov-continue{ margin-top:1.1rem; width:100%; }
.deadline-note{ color:var(--bad); font-size:.7rem; letter-spacing:.1em; margin-top:.8rem; font-family:"Consolas",monospace; }

/* ---------- ending screen ---------- */
.ending .ov-title{ font-size:1.7rem; letter-spacing:.4em; }
.ending-id{ font-family:"Consolas",monospace; color:var(--accent); font-size:.72rem; letter-spacing:.3em; margin-bottom:.4rem;}
.ending-stats{ border:1px solid var(--line); border-radius:4px; padding: .8rem 1rem; font-size:.78rem; line-height:1.8; margin-bottom:1rem;}
.missed-list{ font-size:.76rem; color:var(--dim); line-height:1.7; max-height:180px; overflow-y:auto; border-top:1px dashed var(--line); padding-top:.6rem; margin-top:.6rem;}
.missed-list li{ margin-left:1.1rem; margin-bottom:.2rem;}
.epi-chars{ font-size:.8rem; line-height:1.8; margin-bottom:1rem; color:var(--dim);}
.epi-chars b{ color:var(--ink); font-weight:600;}

/* ---------- phone ---------- */
.phone{ width:min(400px,92vw); margin:0 auto; }
.phone-screen{ background:#0a0d13; border:1px solid var(--line); border-radius:18px; padding:1rem; min-height:480px; display:flex; flex-direction:column; }
.phone-topbar{ display:flex; justify-content:space-between; align-items:center; font-family:"Consolas",monospace; font-size:.7rem; color:var(--accent); letter-spacing:.15em; padding-bottom:.6rem; border-bottom:1px solid var(--line); }
.phone-tabs{ display:flex; gap:.3rem; margin:.7rem 0; }
.phone-tab{ flex:1; text-align:center; font-size:.62rem; letter-spacing:.15em; text-transform:uppercase; padding:.4rem 0; border:1px solid var(--line); border-radius:3px; cursor:pointer; color:var(--dim);}
.phone-tab.on{ color:var(--accent); border-color:var(--accent); }
.phone-body{ flex:1; overflow-y:auto; min-height:0;}
.contact-row{ display:flex; justify-content:space-between; align-items:center; padding:.6rem .4rem; border-bottom:1px solid #14171f; cursor:pointer; }
.contact-row:hover{ background:rgba(255,255,255,.03); }
.contact-row .c-avatar{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:.7rem; margin-right:.6rem; background:#11141c; color:var(--accent); font-family:monospace;}
.contact-row .c-name{ font-size:.8rem; }
.contact-row .c-sub{ font-size:.62rem; color:var(--dim); }
.thread-msgs{ padding:.5rem .2rem; display:flex; flex-direction:column; gap:.45rem; }
.msg-b{ max-width:80%; padding:.5rem .7rem; border-radius:10px; font-size:.78rem; line-height:1.5; }
.msg-b.them{ background:#161a24; align-self:flex-start; border-bottom-left-radius:2px;}
.msg-b.me{ background:#23303f; align-self:flex-end; border-bottom-right-radius:2px;}
.msg-b .mt{ display:block; font-family:"Consolas",monospace; font-size:.58rem; color:var(--dim); margin-bottom:2px;}
.callrow{ font-size:.74rem; padding:.45rem .3rem; border-bottom:1px solid #14171f; display:flex; justify-content:space-between;}
.callrow .mt{ font-family:"Consolas",monospace; color:var(--dim); font-size:.62rem;}
.c-actions{ margin-top:.7rem; display:flex; gap:.5rem;}

/* ---------- journal ---------- */
.journal-note{ border-left:3px solid var(--line); padding:.5rem .8rem; margin-bottom:.7rem; font-size:.8rem; line-height:1.6;}
.journal-note b{ color:var(--accent); display:block; font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; margin-bottom:.2rem;}
.journal-note.memory{ border-left-color:#7ec8a0; }
.char-card{ border:1px solid var(--line); border-radius:4px; padding:.7rem .9rem; margin-bottom:.7rem; font-size:.78rem; line-height:1.6;}
.char-card h4{ letter-spacing:.2em; font-size:.8rem; }
.char-card .cc-loc{ color:var(--accent); font-size:.66rem; letter-spacing:.15em; font-family:"Consolas",monospace; margin:.25rem 0;}
.char-card .cc-bio{ color:var(--dim); }
.hypo{ border-left:3px solid var(--gold); background:rgba(255,180,84,.04); padding:.55rem .8rem; margin-bottom:.5rem; font-size:.78rem; line-height:1.6; }

/* ---------- toast ---------- */
#toast-zone{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:.4rem; align-items:center;}
.toast{ background:#0c0f16; border:1px solid var(--accent); color:var(--ink); font-size:.76rem; padding:.55rem 1.1rem; border-radius:4px; letter-spacing:.05em; box-shadow:0 6px 30px rgba(0,0,0,.6); animation:pop .3s ease;}
.toast.bad{ border-color:var(--bad);}

/* intro cinematic */
#intro-lines{ max-height:52vh; overflow-y:auto; }
.intro-line{ font-size:.92rem; line-height:1.9; margin-bottom:.7rem; animation:feedIn .5s ease; }
.intro-line.speaker{ font-family:"Consolas",monospace; color:var(--accent); font-size:.66rem; letter-spacing:.3em; text-transform:uppercase; }
.intro-line.sys{ color:var(--dim); font-style:italic; font-size:.8rem;}

/* settings rows */
.set-row{ display:flex; justify-content:space-between; align-items:center; padding:.6rem 0; border-bottom:1px solid var(--line); font-size:.82rem;}
.set-row .note{ color:var(--dim); font-size:.68rem;}
::-webkit-scrollbar{ width:8px; } ::-webkit-scrollbar-thumb{ background:#22262f; border-radius:4px;}
@media (max-width:1100px){ #game-body{ grid-template-columns: 280px 1fr 240px;} }

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230c0f16'/><text x='16' y='22' font-size='14' font-family='monospace' fill='%23ffb454' text-anchor='middle'>24</text></svg>">
</head>
<body data-phase="morning">

<!-- ======= MAIN MENU ======= -->
<div id="screen-menu" class="screen">
  <div class="menu-bg"></div>
  <div class="menu-inner">
    <div class="menu-clock" id="menu-clock">08:00</div>
    <h1 class="menu-title">24 HOURS</h1>
    <p class="menu-sub">A day in Vespera. The world does not wait for you.</p>
    <div class="menu-buttons">
      <button id="btn-new" class="btn btn-lg">NEW GAME</button>
      <button id="btn-continue" class="btn btn-lg hidden">CONTINUE</button>
      <button id="btn-newdayplus" class="btn btn-lg btn-gold hidden">NEW DAY+ <span class="men-note">keep your journal</span></button>
      <button id="btn-archive" class="btn btn-lg">DAY ARCHIVE</button>
      <button id="btn-settings" class="btn btn-lg">SETTINGS</button>
      <button id="btn-credits" class="btn btn-lg">CREDITS</button>
    </div>
    <p class="menu-hint">Every action takes time. Every decision means giving up another possibility.</p>
  </div>
</div>

<!-- ======= GAME SCREEN ======= -->
<div id="screen-game" class="screen hidden">
  <header id="hud">
    <div class="hud-left">
      <div id="hud-clock">08:00</div>
      <div>
        <div id="hud-date">THURSDAY · 12 OCTOBER</div>
        <div id="hud-phase">MORNING</div>
      </div>
    </div>
    <div class="hud-center">
      <div class="hud-bar">
        <div id="hud-bar-fill"></div>
        <div id="hud-hazards"></div>
      </div>
      <div class="hud-bar-label"><span id="hud-elapsed">08:00</span><span id="hud-remaining">16H 00M LEFT</span><span>00:00</span></div>
    </div>
    <div class="hud-right">
      <div id="hud-location">APARTMENT</div>
      <div class="hud-btns">
        <button id="btn-phone" class="btn btn-icon" title="Phone">▤</button>
        <button id="btn-journal" class="btn btn-icon" title="Journal">✎</button>
        <button id="btn-pause" class="btn btn-icon" title="Pause">‖</button>
      </div>
    </div>
  </header>

  <main id="game-body">
    <section id="panel-map">
      <div id="map-wrap">
        <svg id="map" viewBox="0 0 420 460" preserveAspectRatio="xMidYMid meet">
          <!-- background layers are injected by ui.js -->
          <g id="map-river"></g>
          <g id="map-roads"></g>
          <g id="map-districts"></g>
          <g id="map-markers"></g>
          <g id="map-labels"></g>
        </svg>
      </div>
      <div id="map-side">
        <div id="map-side-info">Select a district to see travel time.</div>
        <button id="btn-go" class="btn hidden">TRAVEL</button>
      </div>
    </section>

    <section id="panel-scene">
      <div id="scene-head">
        <div id="scene-loc-name"></div>
        <div id="scene-loc-hours" class="dim"></div>
      </div>
      <div id="scene-desc"></div>
      <div id="scene-people"></div>
      <div id="scene-actions"></div>
    </section>

    <section id="panel-side">
      <div class="side-box">
        <h3>ACTIVE THREAD</h3>
        <div id="objectives"></div>
      </div>
      <div class="side-box grow">
        <h3>CITY FEED</h3>
        <div id="feed"></div>
      </div>
    </section>
  </main>
</div>

<!-- ======= OVERLAYS ======= -->
<div id="overlay" class="overlay hidden"><div id="overlay-box"></div></div>
<div id="toast-zone"></div>

<script>
/* ============================================================
   24 HOURS — game data: city, characters, clues
   ============================================================ */
"use strict";

const DATA = {};

/* ---- time helpers (minutes since 00:00) ---- */
function h(hh, mm) { return hh * 60 + (mm || 0); }
function fmt(min) {
  if (min >= 1440) return "24:00";
  const hh = Math.floor(min / 60), mm = Math.floor(min % 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

/* ---- travel time matrix (minutes, symmetric) ---- */
DATA.MATRIX = {
  apartment: { station: 12, oldtown: 18, business: 25, riverside: 15, industrial: 35 },
  station:   { oldtown: 10, business: 15, riverside: 20, industrial: 30 },
  oldtown:   { business: 12, riverside: 15, industrial: 25 },
  business:  { riverside: 15, industrial: 20 },
  riverside: { industrial: 25 },
  industrial:{}
};

DATA.LOCATIONS = {
  apartment: {
    name: "The Apartment",
    area: "Venskaya Hill",
    hoursLabel: "HOME · ALWAYS OPEN",
    desc: {
      morning: "Grey light through the blinds. The kettle you never replaced hums. Alex's hoodie is still on the chair where he threw it last month, before the argument you never really finished.",
      afternoon: "Dust drifts in the afternoon light. The apartment is quiet, full of the day you are not spending anywhere else.",
      evening: "The window holds Vespera's lights at arm's length. From up here the city looks like a circuit board of obligations.",
      night: "The street lamp flicks shadows across the ceiling. Midnight is a finish line, and you can feel the hours thinning."
    }
  },
  station: {
    name: "Central Station",
    area: "Transit Hub",
    hoursLabel: "HALLS 05:00–24:00 · LOCKER HALL 06:00–22:00",
    lockers: [h(6,0), h(22,0)],
    desc: {
      morning: "Announcements stack over announcements. Commuters pour down the escalators in slow grey rivers. The 10:30 from the Capital sits on the departures board.",
      afternoon: "The hall breathes out. Tourists photograph the Art Nouveau clock, pigeons audit the floor. The locker hall hums like a beehive of small metal secrets.",
      evening: "Shift workers, one evening departure, a janitor's wide slow mop. The board lists one train to Kyrdal at 19:20, mostly empty.",
      night: "The vapour lamps make the marble glisten as if wet. A last train sighs somewhere far off. Almost nobody is left to arrive."
    }
  },
  oldtown: {
    name: "The Old Town",
    area: "Historic Quarter",
    hoursLabel: "CAFÉ HALCYON 07:00–20:00 · PAWNSHOP 10:00–20:00",

    opts.push({label:"\"The two thousand marks. Say it out loud, Jonas.\"", cost:10,
      if:function(){ return !has("jonas_debt") && (has("jonas_debt_hint")||has("jonas_borrowed")||has("debt_note")||has("scrap_won")||has("fraud_link")); },
      pick:function(){
        setF("jonas_debt"); relAdj("jonas",1);
        return {text:"A long silence. \"Spring. I covered a leveraged position with my own savings, then couldn't cover it again. So a colleague introduced me to debt that doesn't live in banks. Interest, two thousand a month, or my knees book an appointment.\"\n\n\"Alex found out in April. He gave me his savings — all of it — and called it 'the last thing I can do for you.' I yelled at him for it. At the only person who—\"\n\nHe recomposes himself like a spreadsheet. \"And last month he discovered that Sera makes loans, and loans need collectors, and collectors need supervision. He called it 'discovering'. He has been WATCHING them, and now I can't reach him, and you are here instead of him, which means something has already gone wrong.\""};
      }});
    if(has("fraud_link") && !has("brandt_told") && !has("mentioned_brandt")){
      opts.push({label:"\"Brandt and Sera met at the yard today. Envelope, no receipt.\"", cost:5,
        pick:function(){
          setF("mentioned_brandt"); relAdj("jonas",2);
          return {text:"Jonas goes pale in a controlled, financial way. \"Then it isn't spot-check bad luck. It's structure.\"\n\nHe grips the table edge. \"Alex photographed them, didn't he. God. Listen to me: do not walk that evidence to Brandt. Men like him don't get exposed. They get expensed.\""};
        }});
    }
    opts.push({label:"\"Alex needs his people tonight. That's you and me.\"", cost:5,
      pick:function(){ relAdj("jonas",1);
        return {text:"\"He's not missing. He's hiding. There's a difference, and it doesn't help you.\" Jonas rubs his eyes. \"Whatever he has, trade it carefully. And if my name gets him hurt—\"\n\nHe stops, and reorganizes his face into a suit. \"Go. My meeting is in eleven minutes.\""};
      }});
    opts.push({label:"\"Good luck with the numbers.\"", cost:0, close:true});
    return {kicker:"Jonas Renaud", title:"Conversation with Jonas", text:greet, opts:opts, farewell:"He's already back inside the glass and the numbers."};
  },

  elio: function(){
    const greet="Elio slides a timetable across the counter before you speak. \"Whatever you lost today, somebody lost it bigger. Ask.\"";
    const opts=[];
    if(has("tin_task") && !has("tin_done") && !has("mara_favor")){
      opts.push({label:"\"Delivery from Café Halcyon — Mara's wedding-cake sample.\"", cost:5,
        pick:function(){
          setF("tin_done"); setF("mara_favor"); relAdj("mara",2); relAdj("elio",2); giveClue("mara_favor");
          return {text:"Elio weighs the tin in one hand and finds it correct. \"From Voss. She's one of the good ones. And you carried it before noon, which makes you a rarer species.\n\nSo: if you ever need a 'technical visit' to the locker hall after hours — a small clock problem, no witnesses, no paperwork — today, that word exists between us.\""};
        }});
    }
    opts.push({label:"\"How do the station lockers work?\"", cost:5,
      pick:function(){
        return {text:"Elio recites it like weather. \"Locker hall: six to twenty-two. Key boxes or code boxes. Code boxes: three wrong entries and the box locks down for the day, and I have to open it with my master key in front of witnesses — embarrassing for everyone, particularly you.\n\nSpare keys for code boxes live in the floor office, and the logbook sees everything. The logbook is the only colleague I've never had to forgive.\""};
      }});
    if(has("devin_key") && !has("key_confirmed")){
      opts.push({label:"\"Anything small and brass pass through here around 17:30?\"", cost:5,
        pick:function(){
          setF("key_confirmed");
          return {text:"Elio flips his ledger with a librarian's contempt. \"Spare key, box fourteen. Signed out 17:29 by a gentleman matching the description of a broken nose. He didn't sign it in. The logbook frowns upon this. As do I.\""};
        }});
    }
    opts.push({label:"\"Another time, Elio.\"", cost:0, close:true});
    return {kicker:"Station information", title:"Elio Marchetti", text:greet, opts:opts, farewell:"He returns to his announcements, each one perfectly deadpan."};
  },

  viktor: function(){
    const greet="The bell over the door announces you to a room of gilded debts. Viktor Sera looks up from a ledger the size of a brick. \"Mm. Look who the city blew in.\"";
    const opts=[];
    if(has("customs_check")||has("fraud_link")||has("manifest_seen")){
      opts.push({label:"\"What do you know about Kessler Logistics?\"", cost:5,
        pick:function(){
          S.flags.susp=(S.flags.susp||0)+1;
          if(has("fraud_link")||has("manifest_seen")){
            setF("susp_viktor");
            return {text:"Viktor smiles with the whole cabinet closed. \"I know a number of things that are worth money, and a number of things that are worth more. That question sits in the second category, which is not the one you can afford.\" He turns a page. \"Careful. Merchants notice when someone shops without a wallet.\""};
          }
          return {text:"\"Logistics. Freight. Nummars,\" Viktor says, bored, cataloguing you instead of the question. \"You're young. Young people ask expensive questions in cheap shoes.\""};
        }});
    }
    if(has("jonas_debt_hint")||has("jonas_borrowed")||has("debt_note")){
      opts.push({label:"\"Does the name Jonas Renaud have an account with you?\"", cost:5,
        pick:function(){
          setF("jonas_debt");
          return {text:"Viktor taps one fingernail on the ledger, delighted by nothing. \"Meridian Quays makes good collateral. Handsome brother, slower to pay than the sea. Loans are not gossip — but let's say the account has family management attached. Their little brother arranged the introduction.\""};
        }});
    }
    if(has("has_document") && !has("doc_sold") && !has("nadia_shown")){
      opts.push({label:"\"I have merchandise. Two years of it.\"", cost:10,
        pick:function(){
          S.flags.viktor_offer=true;
          return {node:{kicker:"Pawnshop of curiosities", title:"Viktor leans back", text:"Viktor reads the folder the way other men read love letters. \"Duplicate customs manifests. Filed twice. Stamped once in the stamp of the honest man and once in the stamp of the men who exist. This is worth a great deal of quiet.\"\n\nHe looks up. \"My offer, which you are free to hate: the folder stays here. Your involvement stays clean. A certain young clerk's problems become… municipal. You sleep. He sleeps. The city sleeps. Beautiful system.\"", opts:[
            {label:"\"Sold. Take it.\"", cost:10,
              pick:function(){ setF("doc_sold"); giveClue("doc_gone");
                return {text:"Viktor files your afternoon in a drawer. \"Pleasure doing ethics with you.\" The bell rings you out into a city that feels one kilo lighter and much worse."};}},
            {label:"\"Not for sale. Forget I came in.\"", cost:5,
              pick:function(){ S.flags.susp=(S.flags.susp||0)+1;
                return {text:"\"Of course.\" Viktor's smile files you under a tab. \"People who show me things and don't sell them tend to come back. They almost always come back.\""};}}
          ], farewell:"The drawer closes on two years of somebody's honesty."}};
        }});
    }
    opts.push({label:"\"Just browsing.\"", cost:5,
      pick:function(){
        return {text:"Clocks with no noon. Locks without doors. A taxidermied fox wearing reading glasses. Everything in this room was somebody's emergency first."};
      }});
    opts.push({label:"\"Goodbye.\"", cost:0, close:true});
    return {kicker:"Old Town", title:"Viktor Sera", text:greet, opts:opts, farewell:"The bell rings. The ledger swallows its boredom again."};
  },

  brandt: function(){
    const greet="Kessler Logistics. Tomas Brandt stands to greet you with a handshake calibrated for photographs. \"A friend of Alex? He's told me nothing but good things. Elastic hours, that boy. Ask.\"";
    const opts=[];
    if(has("customs_check")||has("fraud_link")){
      opts.push({label:"\"What exactly does Kessler ship after 22:00?\"", cost:5,
        pick:function(){
          return {text:"Brandt laughs like a press release. \"After 22:00 our trucks sleep better than our accountants. Consolidated freight, bonded warehousing, customs cooperation. We are, in fact, currently cooperating with a spot-check. You may have read about our transparency.\"\n\nHis eyes file your question under a tab the color of guards at gates."};
        }});
    }
    if(has("fraud_link") && !has("brandt_told") && !has("brandt_decided")){
      opts.push({label:"\"Mention the manifests. Show him it exists.\"", sub:"Dangerous. He will not like knowing it's out there.", cost:10,
        pick:function(){
          setF("brandt_decided");
          return {node:{kicker:"Kessler Logistics", title:"The temperature of the room changes", text:"Brandt examines the material for exactly as long as it takes to memorize it, then slides it back like a menu he won't order from.\n\n\"Revised logistics,\" he says warmly. \"Internal reclassification. Happens at this scale every decade.\"\n\nHe picks up the phone. \"Excuse me one moment — a long, calm phone call.\"", opts:[
            {label:"Leave while he's talking.", cost:5,
              pick:function(){ setF("brandt_told"); giveClue("brandt_alerted"); S.flags.susp=(S.flags.susp||0)+2;
                return {text:"You leave. Behind you the call continues: low, patient, full of the future. Alex's plan just became a wartime one."};}}
          ]}};
        }});
    }
    opts.push({label:"\"Thanks. That's all.\"", cost:0, close:true});
    return {kicker:"Kessler Logistics", title:"Tomas Brandt", text:greet, opts:opts, farewell:"He shakes your hand again. The hand now remembers yours. That is the entire point of the handshake."};
  },

  devin: function(){
    const atScrap = charWhere("devin").loc==="industrial";
    const greet = atScrap
      ? "Devin sits on a dead car between two stacks of dead cars, eating an apple. He finishes the apple before acknowledging you."
      : "Devin checks your reflection in a window before checking you. \"You walk a lot. Today of all days.\"";
    const opts=[];
    opts.push({label:"\"Why are you looking for Alex?\"", cost:5,
      pick:function(){
        return {text:"Devin looks at the middle distance where people borrow money. \"People who borrow get found. I find. I don't ask why. You want philosophy, the library opens at nine tomorrow.\""};
      }});
    if(atScrap && has("devin_key") && !has("scrap_won") && !has("scrap_tried")){
      opts.push({label:"\"The key, 17:30, box 14. I'll trade you my silence.\"", cost:20,
        pick:function(){
          setF("scrap_tried");
          if(has("devin_key_seen") || has("mara_favor") || (S.rel.mara||0)>=3){
            setF("scrap_won"); giveClue("scrap_won"); relAdj("devin",-1); setF("knows_locker");
            return {text:"The apple core lands in a drum. Devin weighs you, the trade, and his employer's interest in paperwork.\n\n\"Friday,\" he says, pressing a small warm key into your palm. \"I don't remember you, you don't remember me. Box 14 was a malfunction.\"\n\nThe key opens a locker. It also closes a debt, though whose is unclear."};
          }
          S.flags.susp=(S.flags.susp||0)+1;
          return {text:"Devin laughs once, without sound. \"You, I don't buy.\"\n\nThe shove into the scrap metal costs you ten minutes and some shoulder skin, and he keeps the key. But now you know what he has — and he suspects that you know."};
        }});
    }
    opts.push({label:"\"Nothing. Just walking.\"", cost:0, close:true});
    return {kicker: atScrap?"The scrapyard":"The quay", title:"Devin Kray", text:greet, opts:opts, farewell:"He doesn't watch you leave. He already knows where you're going."};
  },

  nadia: function(){
    const greet="Nadia's desk looks like a detective's wall compressed into a hastily cleaned surface. \"You owe me a story. Pay up — or at least gossip.\"";
    const opts=[];
    if(has("customs_check")||has("fraud_link")||has("manifest_seen")){
      opts.push({label:"\"Kessler. Customs adjustments. What's in your half-file?\"", cost:10,
        pick:function(){
          setF("nadia_met");
          return {text:"Nadia pulls a folder two years deep. \"Re-stamped manifests. Phantom consignees. A 'spot-check' from customs that ends in a shrug. The pattern is beautiful and unfalsifiable — fraud this size isn't a man, it's a schedule.\"\n\n\"I have structures. I don't have faces. Bring me one page with a real signature and a real man attached, and this stops being a story and becomes a scandal.\""};
        }});
    }
    if(has("has_document") && !has("doc_sold") && !has("nadia_shown") && ((has("nadia_met"))||has("fraud_link"))){
      opts.push({label:"\"Would this page attach a face to it?\"", sub:"Show her the duplicate manifests.", cost:20,
        pick:function(){
          setF("nadia_shown");
          return {node:{kicker:"Vespera Herald", title:"Nadia reads it twice", text:"She reads the manifest like scripture, then like a bill. \"'T. Brandt.' Timestamps. Payment emblems from Sera's side. This is the spine of the whole skeleton — and it's a duplicate, which means the original walked somewhere on a young man's back.\"\n\nShe looks up. \"I can send this to print tonight. Or you walk out and do whatever the human part of you is planning. Choose now: the print deadline is not a suggestion.\"", opts:[
            {label:"\"Send it. Tonight.\"", sub:"The Herald prints at dawn.", cost:10,
              pick:function(){ setF("publish");
                return {text:"'Tonight,' Nadia repeats, and her entire office rearranges itself around the word. Phones. Photographs. A legal email drafted at unusual speed.\n\nSomewhere in this city, a story stops being a danger and becomes a fact about to happen."};}},
            {label:"\"Wait. I have to talk to Alex first.\"", cost:5,
              pick:function(){
                return {text:"Nadia holds out her hand. \"Then the document stays with me as collateral and prints the moment either of you confirms. Fair — because it's the only way that paper leaves my sight.\"\n\nShe locks it in her desk. It will still be there at dawn."};}}
          ]}};
        }});
    }
    opts.push({label:"\"Later, Nadia.\"", cost:0, close:true});
    return {kicker:"Vespera Herald office", title:"Nadia Petrov", text:greet, opts:opts, farewell:"She's already typing about something else. That's how stories survive her."};
  }
};

</script>
<script>
/* ============================================================
   24 HOURS — story layer part 2: location actions + city events
   ============================================================ */
"use strict";

/* action fields: id,label,sub,cost, cond(S)?, once(flag)?, hours:[a,b]? (uses DATA.LOCATIONS[loc].lockers if hoursData)
   run(): returns string | node-object | null (handled elsewhere) */
STORY.ACTIONS = {

  apartment: [
    { id:"mail", label:"Check the mailbox", sub:"Something came with the morning post.", cost:5,
      hours:[h(8,30),h(12,30)], once:"mail_note",
      run:function(){
        setF("mail_note");
        return "Among the utilities and a pharmacy flyer: a strip torn from a timetable. Your name. Alex's handwriting, pressed hard:\n\n\"N–23.\nTrust the quiet place.\n— A.\"\n\nNo greeting. No explanation. The paper is creased like it rode in a pocket for a while before you existed to receive it.";
      }},
    { id:"computer", label:"Use the computer", sub:"Alex was here last night. Someone left the chat open.", cost:10,
      run:function(){
        if(has("alex_chat")) return "The chat log is the same silence as before. 23:58. No new messages. The cursor blinks like a pulse.";
        setF("alex_chat"); giveClue("alex_chat");
        return "Your chat app still has last night open on Alex's account — he borrows your desk when he's here too late to walk home:\n\nA (23:58): it wasn't supposed to happen. not like this.\nA (23:58): tomorrow. before midnight. if i don't call you it's because i can't.\nA (23:59): don't come to the yard.\n\nYou didn't see it until now. The timestamp repaints the entire morning.";
      }},
    { id:"calendar", label:"Check the calendar on the wall", sub:"Birthdays, chores, everyone's small obligations.", cost:5,
      once:"calendar_seen",
      run:function(){
        giveClue("bday");
        return "October is mostly empty, the way months are before they aren't:\n\n· 12 OCT (today): rent day; 'THROW OUT THE MATTRESS — M.'\n· Sofia's clinic shifts, pinned in green.\n· Jonas: 'client dinner — wear the grey'.\n· 23 NOV: ALEX — BIRTHDAY. 'sing the RIGHT year this time.'\n\n23 November. N–23. The note downstairs had exactly those two numbers.";
      }},
    { id:"docs", label:"Go through personal documents", sub:"The drawer where keys and debts go to retire.", cost:10,
      once:"jonas_drawer",
      run:function(){
        giveClue("jonas_borrowed");
        return "Rent contracts. A charging cable knotted past salvation. And in the key drawer, a folded note in Jonas's tidy capitals:\n\n'2,000. I'll fix it, I promise. Do NOT tell Alex.'\n\nTwo years old. You had both agreed, without ever saying so, to let it become furniture.";
      }},
    { id:"news", label:"Coffee and the morning paper", sub:"Vespera Herald, today's edition.", cost:15,
      once:"customs_check",
      run:function(){
        giveClue("customs_check");
        return "You drink coffee you forgot to want and read the Herald so you don't have to think.\n\nPage 7, bottom: 'Unannounced customs spot-checks at the freight terminal. Several firms in administrative review; spokespeople cite procedural modernization.'\n\nAmong them, listed only by section number so its lawyers stay asleep: Kessler Logistics.\n\nThe coffee goes cold. The day feels official now.";
      }}
  ],

  station: [
    { id:"board", label:"Read the departures board", sub:"Arrivals, departures, the daily poetry of delays.", cost:5,
      run:function(){
        let txt="THE BOARD:\n· 10:30 — from the CAPITAL — on time (a woman, one heavy coat, a heavier notebook)\n· 13:55 — to Lučenec — platform 2\n· 17:30 — from Vodna Sever — regional, delayed 10 min\n· 19:20 — to KYRDAL — long-distance, tickets sold: 31\n";
        if(!has("board_note")){ setF("board_note"); txt+="\nYou copy the arrivals onto the back of your hand like a man planning to be somebody's schedule instead of his own."; }
        return txt;
      }},
    { id:"watch", label:"Watch the hall", sub:"People miss trains. You might see someone arrive.", cost:15,
      run:function(){
        return "You get a coffee you don't drink and watch the hall run its permanently-travelling show.\n\nA man in a grey coat reads a newspaper upside-down near the payphones, and has been here longer than his coffee. A student's backpack holds more oranges than books. A bride, a soldier, a man with a vacuum cleaner. The 19:20 to Kyrdal will leave with 31 tickets' worth of escape.";
      }},
    { id:"locker", label:"Locker hall — box 14", sub:"06:00–22:00. Code, brass key, or Elio's mercy.", cost:10,
      lockersOnly:true,
      cond:function(){ return (has("knows_locker")||has("scrap_won")||has("devin_key")) && !has("opened_locker") && !has("doc_sold"); },
      run:function(){ return Engine.lockerScene(); }},
    { id:"listen", label:"Eavesdrop near the information desk", sub:"Elio's counter: the city's lost and found of conversation.", cost:10,
      run:function(){
        return "Near the desk: two students divide a chocolate bar by era of purchase. A porter explains to a tourist that the 19:20 is 'the last train that believes in itself.' An old woman has lost a hat and found, in exchange, three helpers.\n\nLives, arriving and departing, largely unexamined. You get the strange civic peace of watching people whose worst problem today is currently a hat.";
      }},
    { id:"delivertin", label:"Deliver Mara's package to Elio", sub:"A ceremonial tin, a promise, and a deadline of noon.", cost:5,
      cond:function(){ return has("tin_task") && !has("tin_done") && !has("mara_favor") && charAt("elio","station"); },
      run:function(){
        setF("tin_done"); setF("mara_favor"); relAdj("mara",2); relAdj("elio",2); giveClue("mara_favor");
        return "Elio weighs the tin and finds it correct. \"From Voss. She's one of the good ones. And you carried it before noon, which makes you a rarer species.\n\nSo — if you ever need a 'technical visit' to the locker hall after hours, between us there is now a word for that. Small kindness, long memory. That's the job.\"";
      }}
  ],

  oldtown: [
    { id:"notice", label:"Read the community board", sub:"Everything lost, found, or for sale in one square meter.", cost:15,
      once:"notice_board",
      run:function(){
        setF("notice_board");
        return "The notice board is the real government of Vespera:\n\n· LOST: grey wallet, sentimental value, reward.\n· FOR SALE: 1980s exercise bike, motivational cloth included.\n· BUS LINE 7 → Industrial zone: every half hour, at :10 and :40.\n· 'Nurse needed, Vespera Clinic — ask for Sofia L.'\n· A card in clean block letters: 'SERA — CURIOSITIES. LOANS ADVANCED AGAINST QUIET.'\n\nViktor Sera advertises in plain sight. That kind of advertisement is its own kind of warning.";
      }},
    { id:"square", label:"Sit at the fountain", sub:"Old Town conducts its business in the open.", cost:10,
      run:function(){
        return "You sit where the pigeons hold their parliament. A courier and a lawyer argue happily about a three-legged dog. Old Town trust falls into your lap unsolicited; here even privacy is a communal activity.";
      }}
  ],

  business: [
    { id:"lobby", label:"Hover in the Meridian lobby", sub:"Badges, rumors, Jonas's building.", cost:10,
      once:"lobby_gossip",
      run:function(){
        giveClue("lobby_gossip");
        return "You water a ficus with your presence until a colleague of Jonas's waits for the same elevator.\n\n\"Renaud? Solid analyst. Since spring he's—\" the elevator arrives— \"—different. Eats at his desk. Covering something with overtime. The classic. Anyway.\"\n\nThe doors close on the rest of your answer.";
      }},
    { id:"towerbar", label:"Tower Bar — bad coffee, good gossip", sub:"Where the Business District goes to be seen not eating.", cost:15,
      run:function(){
        return "The Tower Bar serves coffee at the temperature of diplomacy. Two stools down, a bond trader does a loud post-mortem on this morning's dip.\n\nYou learn two tickers and one affair. Vespera's economy, in one cup.";
      }}
  ],

  riverside: [
    { id:"bench", label:"The swans' bench", sub:"Where you two feed them. 'The quiet place.'", cost:15,
      run:function(){ return Engine.benchVisit(); }},
    { id:"bridge", label:"Walk the old bridge", sub:"The river does the talking.", cost:15,
      run:function(){
        if(S.time>=h(17)&&S.time<h(21)) return "Sunset performs the same miracle it performs every evening, which is making the whole city briefly forgivable. The water is poured copper. Boats come home.\n\nSomewhere behind you, the day is making decisions that cannot be undone, and you are watching the light instead.";
        return "The bridge moves under the wind in the old, legal way. Rowers upstream, a heron with opinions, the whole city reflected slightly better than it is. As water does.";
      }},
    { id:"quaywalk", label:"Walk the quay past the hospital", sub:"Ambulance lane, staunch brick, simple geometry.", cost:10,
      run:function(){
        if(S.time<h(18)) return "The hospital presents its least romantic face to the river and its most necessary one to the city. Nurses smoke at the ambulance door with the commitment of people on a scheduled break from gravity.";
        return "The hospital's night windows come on floor by floor, patient by patient. From here the institution looks almost gentle — a lit ship that has decided, for tonight, to keep everyone aboard.";
      }}
  ],

  industrial: [
    { id:"yard", label:"Kessler Logistics — the office", sub:"Director Brandt receives, apparently, anyone.", cost:10,
      cond:function(){ return charAt("brandt","industrial"); },
      run:function(){ return Engine.openDialog("brandt"); }},
    { id:"fence", label:"Watch the loading yard through the fence", sub:"The gap between fence and generator housing.", cost:15,
      cond:function(){ return !has("fraud_link"); },
      run:function(){
        setF("fence_watched"); S.flags.susp=(S.flags.susp||0)+1;
        if(S.time>=h(14,45) && S.time<=h(15,30)){
          giveClue("fraud_link");
          return "You find the gap between the fence and the generator housing that every city keeps for sixteen-year-olds and journalists.\n\n14:58. Brandt walks out to the yard. Sera's green car idles like a patient predator. An envelope crosses space without changing owners so much as changing species.\n\nThen — a clipboard, a manifest stamped and re-stamped inside the same minute, customs names crossed out and re-entered. Two men under one streetlamp, lit exactly like evidence.\n\nThis is what Alex saw. This is what Alex IS.";
        }
        if(S.time>=h(15,30)){
          return {text:"The yard is scoured and quiet. Chains, steam, one guard checking nothing with exemplary diligence.\n\nWhatever crossed this yard today, it arrived, it was seen by fate and no one else, and it's gone."};
        }
        return "Forklifts. Stamped manifests. A guard with the vigilant eyes of a man paid to remain unaware of specifics. Nothing — except trucks that queue at an hour when trucks queueing makes no sense, and a yard ledger that personally signs off an arrival logged 'overviewed, no exceptions.'\n\nSomething here is organized. You'll know more when the wrong people are in it.";
      }},
    { id:"scrap", label:"The scrapyard — Devin's office", sub:"Evenings, between stacked cars. Bring nerve.", cost:10,
      cond:function(){ return charAt("devin","industrial") && S.time>=h(18); },
      run:function(){ return Engine.openDialog("devin"); }},
    { id:"busboard", label:"Bus stop, line 7 — timetable", sub:"Trams of the working world.", cost:5,
      once:"bus_note",
      run:function(){
        return "LINE 7 — INDUSTRIAL ZONE: departs :10 and :40, every half hour. Last return, 22:40.\n\nYou note it the way people note things they hope to never need: precisely.";
      }}
  ]
};

/* ============================================================
   CITY EVENTS
   {id, t, winEnd?, cond(S)?, run()->node|{feedText}|null}
   ============================================================ */
STORY.EVENTS = [
  { id:"ev_mara_voicemail", t:h(8,20),
    run:function(){
      msgIn("mara","alex came by last night. sat in the corner 'watching the door'. wouldn't say what. i'm at halcyon till 15:00 if you want the human version. — M");
      feedAdd("sys","New message from Mara Voss.");
      return null;
    }},
  { id:"ev_devin_mara", t:h(9,30), winEnd:h(9,55),
    run:function(active){
      if(active && S.loc==="oldtown"){
        return {node:{kicker:"Café Halcyon", title:"9:31 — through the glass",
          text:"You're still holding your cup when the grey coat comes in. Broken nose, weather-patient stillness. He leans on the counter; Mara's smile switches to its professional setting.\n\nDEVIN: 'The boy. Last night. Where.'\nMARA: 'Alex? I don't keep his calendar. I keep the cakes fresh.'\nDEVIN: 'He was here. At nine.'\nMARA: 'He was here yesterday. Today is today.'\n\nHe places a pawnshop card on the counter like a tip, then studies you for exactly one second too long.", opts:[

<script>
/* ============================================================
   24 HOURS — story layer part 3: meeting scenes + endings
   ============================================================ */
"use strict";

/* ---------- objectives ---------- */
STORY.OBJECTIVES = function(){
  const o=[];
  function push(txt,done){ o.push({t:txt,done:!!done}); }
  if(!has("fraud_link") && !has("alex_witness") && !has("manifest_seen"))
    push("Find out what happened to Alex", has("alex_chat")||has("sofia_night"));
  if(has("alex_witness")||has("fraud_link")) push("Understand what Alex witnessed", true);
  if(has("mail_note") && !has("knows_quiet_place")) push("Find the 'quiet place' the note means", false);
  if(has("knows_quiet_place")){
    push(has("brandt_told") && has("knows_station_meet")
      ? "Meet Alex — 23:00, station hall (the bench is burned)"
      : "Meet Alex — 23:00, the swans' bench", false);
  }
  if(has("knows_locker") && !has("opened_locker") && !has("doc_sold") && S.time<h(22))
    push("Locker 14, Central Station hall (code 2311 if you know it)", false);
  if(has("has_document") && !has("nadia_shown") && !has("doc_sold") && S.time<h(21) && (has("nadia_met")||has("fraud_link")||has("customs_check")))
    push("The manifests are evidence — Nadia would know what this is", false);
  if(has("brandt_told")) push("Brandt knows the duplicate exists", false);
  if(!o.length) push("Get through the day in one piece", false);
  return o;
};

/* ---------- swans' bench visit (daytime) ---------- */
STORY.benchVisit = function(){
  if(has("knows_quiet_place")){
    setF("bench_revisited");
    return "The swans' bench. Initials scratched by a fifteen-year-old with a fork: A + YOU. Badly executed. Permanently true.\n\nYou know what this place is now. The only question left is whether, at 23:00, someone arrives to occupy it with you — or whether at 23:00 it is just you and the water again.";
  }
  if(has("mail_note")){
    return {kicker:"Vodna quay", title:"The swans' bench",
      text:"You know this bench. Two kids, a bag of old bread, swans with the manners of customs officials. 'A + YOU', scratched with a fork, badly, permanently.\n\n'N–23. Trust the quiet place.'\n\nQuiet. Water. Swans. You.",
      opts:[
        {label:"\"…This is it. This is the quiet place.\"", cost:5,
          pick:function(){ setF("knows_quiet_place"); giveClue("quiet_place");
            return {text:"It's the swans. It was always the swans.\n\nSomewhere in your chest a slot clicks into a machine — 23:00, this bench. Now you only need the rest of what he wanted to tell you, and the nerve to be here at midnight minus one hour."};}},
        {label:"\"I can't go inventing meetings out of bread crumbs.\"", cost:5,
          pick:function(){
            return {text:"You get up. The swans watch you leave with the personal offense of animals who have misplaced their faith in a system that works.\n\nThe note stays a riddle, and the afternoon stays short."};}}
      ]};
  }
  return "The bench is empty. You sit anyway; morning joggers' crumbs say other people have habits here too. It's nice. It's also somewhere you can't afford to sit for long.";
};

/* ---------- locker hall ---------- */
STORY.lockerScene = function(){
  if(has("opened_locker")) return "Box 14 stands open and empty, doing its best impression of an alibi.";
  if(has("scrap_won") || has("devin_key")){
    setF("opened_locker"); setF("has_document"); giveClue("manifest_seen"); giveClue("locker_full");
    return "The brass key turns like it rehearsed.\n\nInside box 14: a folder labelled in Alex's square capitals — 'IN CASE I'M WRONG'. The duplicate customs manifests. Two photographs of Brandt and Sera in the yard at night. And a clinic receipt: Sofia Lark, 03:12, last night.\n\nThe whole night suddenly has a shape. And the shape has your friend's handwriting on it.";
  }
  const tries = S.flags.codeTries||0;
  if(tries>=2 && !has("elio_favor")){
    return "The pad on box 14 is red-faced with rejection. The clerk's eyes flick over with one raised eyebrow: three strikes and Elio opens this box in front of witnesses with the master key. Today is not the day you become the story he tells at dinner.";
  }
  return {codePad:true, kicker:"Locker hall", title:"Box 14 — code pad",
    text:"Four steel digits between you and whatever Alex hid from the entire world.\n\n"+(tries===1 ? "The pad remembered one wrong code with digital patience." : "You breathe on the steel and it fogs, which feels appropriate."),
    options_note:"Enter a four-digit code. Wrong entries are remembered by the machine, and eventually by the clerk."};
};

/* ---------- meeting: the bench ---------- */
STORY.meetingBench = function(){
  Engine.advance(8);
  if(has("brandt_told") && !has("knows_station_meet")){
    setF("ambushed");
    return {kicker:"23:0X — Vodna quay, swans' bench", title:"Not him", close:true,
      text:"You wait with the river. 23:07.\n\nThe footsteps that arrive are wrong: too even, no bag, no jacket rustle. Devin steps out of a shadow as if the shadow had been holding his place in line.\n\nDEVIN: 'He sent word. Last minute. Business re-scheduled.' He holds up Alex's lighter — the one with the dent from when you dropped it off the bridge in school. 'Sent it via me. People trust mail that means something.'\n\nHe is not even slightly out of breath. The meeting was never cancelled. It was re-scheduled into an ambush, and you are holding it.",
      after:"Whatever plan B Alex had, you failed to be part of it.",
      ending:"wrong_person"};
  }
  return {kicker:"23:0X — Vodna quay, swans' bench", title:"The quiet place",
    text:"You wait with the river. 23:07. Swans moored below like small white arguments against the dark.\n\nThen: footsteps with a bag's rustle and a run left in them. Alex, out of breath, the whole day's weight on his face. He sees you — and something in his shoulders lets go of a load it has carried since 08:00.",
    opts:[
      {label:"\"Alex. Last night. All of it.\"", cost:15,
        pick:function(){ return STORY.meetingTruthStep(); }},
      {label:"Show him what you found today.", cost:5,
        if:function(){ return has("has_document")||has("fraud_link")||has("manifest_seen"); },
        pick:function(){ return STORY.meetingTruthStep(); }}
    ]};
};

STORY.meetingTruthStep = function(){
  let txt="Alex sits like his legs have been handed notice of dismissal.\n\n\"23:40 last night. I'm closing the yard office. Brandt and Sera come in for a drop that touches nothing official — no camera, no log. One grey envelope. I photographed a page of the manifest from the shadows. Then my phone died. Then Devin's silhouette was in the yard, and I couldn't tell if he'd seen the screen's glow.\"\n\nHe looks at what you're holding. \"I hid my copies at the station, box fourteen. If everything went badly, that was plan C. Plans C are for when B fails, and B was 'nothing goes wrong.'\"";
  if(has("debt_note")||has("jonas_debt")){
    txt+="\n\n\"And Jonas. You know about Jonas's debt — don't you. That's how deep this goes. The firm ruins customs. Sera ruins families. And my brother is the town where the two roads meet. He thought he was borrowing money. He was being filed.\"";
  } else {
    txt+="\n\n\"And there's the part I can't say here. My brother. Jonas owes Sera in a way that isn't money-shaped anymore. That's why they knew our names. That's why it's me standing in a yard office until midnight every day.\"";
  }
  giveClue("alex_witness"); giveClue("manifest_seen");
  setF("met_alex");
  return {text:txt, opts:STORY.finalChoices()};
};

STORY.finalChoices = function(){
  const opts=[];
  opts.push({label:"\"Tomorrow: everything goes to Nadia Petrov. Together.\"", sub:"Press, testimony, dawn edition. The long road, the right one.", cost:10,
    pick:function(){ setF("final_press");
      return {text:"Alex studies you for a long moment — the same look he had at fifteen, deciding whether to trust you with the other half of a sandwich and, as it turned out, every subsequent decision.\n\n\"Together,\" he says. \"And first thing tomorrow, before they're awake enough to be lucky.\"", endingSignal:true};}});
  if(has("jonas_debt") && !has("fraud_link") && !has("manifest_seen")){
    opts.push({label:"\"Give me the folder. I trade it back to Brandt — Jonas's debt dies.\"", sub:"Solve it. Quietly. Protect your family. Trust a smiling man.", cost:10,
      pick:function(){ setF("final_bill_brandt");
        return {text:"Alex's face cycles through three kinds of disbelief and lands on grief. \"That's the deal you'd make?\"\n\nBut you both know the sick mathematics of it: one folder, one debt, one brother who sleeps tonight. It is the quiet, wrong answer that fits the lock of your own family.", endingSignal:true};}});
  }
  opts.push({label:"\"You should leave Vespera tonight. Take the 19:20— the last thing tonight. Go.\"", sub:"Send Alex away. Stay and hold the bag yourself.", cost:10,
    pick:function(){ setF("final_alex_flees");
      return {text:"Alex shakes his head slowly. \"That's not a plan. That's applause.\"\n\nBut you mean it, and he sees that you mean it, and for one second the two of you stand in the dark calculating exactly how much of your lives this folder is worth.", endingSignal:true};}});
  return opts;
};

/* ---------- meeting: the station hall (plan B, after Brandt alert) ---------- */
STORY.meetingHall = function(){
  Engine.advance(8);
  return {kicker:"23:0X — Central Station, under the departures board", title:"Plan B",
    text:"Under the board, the hall's marble carries every footstep like gossip. 23:07.\n\nAlex comes down the steps slowly, scanning the hall the way credit checks scan. He sees you. Relief, then verification, then relief allowed to stay.",
    opts:[
      {label:"\"Alex. Last night. All of it.\"", cost:15,
        pick:function(){ return STORY.meetingTruthStep(); }}
    ]};
};

<script>
/* ============================================================
   24 HOURS — story layer part 4: ending evaluation + epilogues
   ============================================================ */
"use strict";

STORY.evaluateEnding = function(){
  const met = !!S.flags.met_alex;
  const fraud = has("fraud_link")||has("manifest_seen");
  const debt = has("jonas_debt")||has("debt_note")||has("jonas_debt_hint");
